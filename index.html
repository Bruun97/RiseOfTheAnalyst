<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rise of the Analyst">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="description" content="Pixel-art RPG: from the post room of the world's biggest asset manager to the corner office. A bus and two trains from a room above a chip shop.">
<title>Rise of the Analyst</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* One-screen phone game. Pixel canvas on top, RPG dialog box docked at the bottom. Night-time city pixel art, bone-white UI chrome. */
:root{ --bg:#0d0f16; --ui:#161a26; --ui2:#222838; --line:#3a4256; --ink:#f1efe6; --ink-2:#a8adbd; --gold:#f5c542; --red:#ff6b6b; --green:#5ee28a;
  --pix:'Silkscreen','Courier New',monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#stage{position:relative;flex:1;min-height:0;background:#0a0c12}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-family:var(--pix);font-size:11px;letter-spacing:.5px}
.hud .box{background:rgba(13,15,22,.85);border:2px solid var(--line);padding:5px 8px;color:var(--ink);white-space:nowrap;box-shadow:2px 2px 0 #000;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hud .box small{color:var(--ink-2);font-size:9px;display:block;overflow:hidden;text-overflow:ellipsis}
.hud .en{color:var(--gold)}
.hud #menuBtn{pointer-events:auto;font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:5px 10px;box-shadow:2px 2px 0 #000;min-height:34px}
.hud .right{display:flex;gap:6px}
#dlg{background:var(--ui);border-top:3px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:10px;flex-direction:column;max-height:58%;overflow:auto}
#dlg.open{display:flex}
.dl{display:flex;gap:10px;align-items:flex-start}
.portrait{width:56px;height:56px;flex:none;border:2px solid var(--line);background:#0a0c12;image-rendering:pixelated}
.dname{font-family:var(--pix);font-size:11px;color:var(--gold);margin:0 0 4px;letter-spacing:.5px}
.dtext{margin:0;font-size:15px;line-height:1.45;min-height:44px;white-space:pre-line}
.choices{display:grid;gap:6px}
.choices button{font:600 14px var(--sans);text-align:left;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:10px 12px;min-height:44px;box-shadow:2px 2px 0 #000}
.choices button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
.choices button.gold{border-color:var(--gold);color:var(--gold)}
.choices button.red{border-color:var(--red);color:var(--red)}
.choices button.green{border-color:var(--green);color:var(--green)}
.choices button:disabled{opacity:.45}
.choices button small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.sheet{position:absolute;inset:0;background:rgba(10,12,18,.94);z-index:9;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.sheet.open{display:flex}
.sheet h2{font-family:var(--pix);font-size:14px;color:var(--gold);margin:0 0 8px}
.sheet .close{align-self:flex-end;font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:6px 12px;min-height:36px;margin-bottom:8px}
.statrow{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.statrow .bar{height:10px;background:var(--ui2);border:2px solid var(--line)}
.statrow .bar i{display:block;height:100%;background:var(--gold)}
.statrow .bar i.blue{background:#4ea1ff}
.statrow button{font-family:var(--pix);font-size:10px;background:var(--gold);color:#2b1d05;border:0;padding:4px 8px;min-height:28px}
.q{border:2px solid var(--line);padding:8px 10px;margin:6px 0;background:var(--ui)}
.q b{display:block;font-size:14px}.q.done{opacity:.5;text-decoration:line-through}
.q small{color:var(--ink-2)}
.ins{border:2px solid var(--line);padding:6px 10px;margin:4px 0;background:var(--ui);font-size:13px}
.ins b{color:var(--gold)}.ins .ok{color:var(--green);font-family:var(--pix);font-size:10px}.ins .no{color:var(--red);font-family:var(--pix);font-size:10px}.ins .wait{color:var(--ink-2);font-family:var(--pix);font-size:10px}
.pos{font-family:var(--pix);font-size:11px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;margin:6px 0}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--ui);border:2px solid var(--gold);color:var(--ink);font-family:var(--pix);font-size:11px;padding:8px 12px;box-shadow:3px 3px 0 #000;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8;max-width:86%;text-align:center}
.toast.show{opacity:1}
.mini{position:absolute;inset:0;background:rgba(10,12,18,.95);z-index:9;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(14px + env(safe-area-inset-bottom,0px));gap:10px;overflow:auto}
.mini.open{display:flex}
.mini canvas{width:100%;height:160px;border:2px solid var(--line);background:#0a0c12;image-rendering:auto}
.mini .read{font-size:14px;border:2px solid var(--line);padding:8px 10px;background:var(--ui)}
.mini .read b{color:var(--gold)}
.mini .top{display:flex;justify-content:space-between;align-items:center}
.mini .top b{font-family:var(--pix);font-size:12px;color:var(--gold)}
.mini .close{font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:6px 12px;min-height:36px}
.tk{display:flex;gap:6px;flex-wrap:wrap}
.tk button{font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:8px 10px;min-height:40px}
.tk button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:2px solid var(--line);background:var(--ui);padding:8px 10px;margin:6px 0;font-size:14px}
.row small{display:block;color:var(--ink-2);font-size:12px}
.row .ok{color:var(--green);font-family:var(--pix);font-size:10px}.row .no{color:var(--red);font-family:var(--pix);font-size:10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0d0f16}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="box"><span id="hDay">Day 1 · Mon</span><small id="hRank">Office Junior</small></div>
      <div class="right"><div class="box"><span class="en" id="hEnergy">●●●●●●●●</span><small>energy</small></div><div class="box"><span id="hCash">$400</span><small id="hBook">—</small></div><button id="menuBtn" aria-label="Menu">MENU</button></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="sheet" id="sheet"><button class="close" id="sheetClose">CLOSE</button><div id="sheetBody"></div></div>
    <div class="mini" id="mini"></div>
  </div>
  <div id="dlg"><div class="dl"><canvas class="portrait" id="portrait" width="28" height="28"></canvas><div style="min-width:0;flex:1"><p class="dname" id="dname"></p><p class="dtext" id="dtext"></p></div></div><div class="choices" id="choices"></div></div>
</div>

<script>
(() => {
const KEY='rota.v3', T=16;
const $=id=>document.getElementById(id);
const rnd=()=>Math.random(), gauss=()=>{ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(rnd()*a.length)];
const money=v=>(v<0?'−':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
const moneyM=v=>{ const a=Math.abs(v); const s=a>=1e9?(a/1e9).toFixed(1)+'B':a>=1e6?(a/1e6).toFixed(1)+'M':Math.round(a/1e3)+'k'; return (v<0?'−':'')+'$'+s; };
const pct=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+'%';
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const hash=s=>{ let h=0; for (const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; };

/* ---------- sprites (pixel art drawn from strings; no image assets) ---------- */
const PAL={ '.':null, k:'#1c1a22', s:'#f0c9a6', S:'#c89a76', h:'#4a2f22', H:'#e7c36b', R:'#b43a3a', w:'#eeeeee', n:'#1f2d4a', N:'#4a6fb0', g:'#3f8a5a', G:'#6f6a8a', y:'#f5c542', b:'#2b2f3c', B:'#8a8f9c', o:'#d08a4a', p:'#8a5a8a', l:'#aab4c8', d:'#2a2d36' };
function sprite(rows, map){ const h=rows.length, w=rows[0].length; const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){ const ch=rows[j][i]; const col=(map&&map[ch])||PAL[ch]; if (col){ x.fillStyle=col; x.fillRect(i,j,1,1); } } return c; }
// character 12x16: hair h, skin s, shirt t, pants q, shoes k. frame: legs apart or together. dir: eyes offset.
function charFrames(hair, shirt, pants, skin){
  const map={h:hair, t:shirt, q:pants, e:'#1c1a22', s:skin||'#f0c9a6', k:'#1c1a22', w:'#eeeeee'};
  const mk=(eyes, legs)=>[
    "....hhhh....","...hhhhhh...","...hhhhhh...","...hsssssh..".replace('sssss', eyes),"...ssssss...","....ssss....","...tttttt...","..tttttttt..","..s.tttt.s..","..s.tttt.s..","....tttt....","....qqqq....","....qqqq....",
    legs==='a'?"...qq..qq...":"....q..q....", legs==='a'?"...kk..kk...":"....k..k....","............"];
  const F={}; const E={down:'sesse', left:'esss.', right:'.ssse', up:'sssss'};
  for (const d in E){ F[d]=[sprite(mk(E[d],'a'),map), sprite(mk(E[d],'t'),map)]; }
  F.portrait = sprite([
    "......hhhhhhhhhhhhhhhh......","....hhhhhhhhhhhhhhhhhhhh....","...hhhhhhhhhhhhhhhhhhhhhh...","...hhhhhhhhhhhhhhhhhhhhhh...","...hhhhhhsssssssssshhhhhh...","...hhhhsssssssssssssshhhh...","...hhhsssssssssssssssshhh...","...hhhsssssssssssssssshhh...","...hhsssssssssssssssssshh...","...hhsssswwessssswwesssshh..","...hhssssweessssswesssssh...","....ssssssssssssssssssss....","....ssssssssssssssssssss....","....sssssssssssssssssss.....","....ssssssssskkksssssss.....",".....ssssssssssssssssss.....","......ssssssssssssssss......",".......sssssssssssss........","........tttttttttttt........",".......tttttttttttttt.......","......tttttttttttttttt......",".....tttttttttttttttttt.....","....tttttttttttttttttttt....","...tttttttttttttttttttttt...","...tttttttttttttttttttttt...","..tttttttttttttttttttttttt..","..tttttttttttttttttttttttt..","..tttttttttttttttttttttttt.."].map(r=>r.padEnd(28,'.').slice(0,28)), map);
  return F;
}
const HAIRS=['#1c1a22','#4a2f22','#e7c36b','#b9b1a3','#d08a4a','#2b1d12','#6b3a2a','#8a8f9c'];
const SKINS=['#f0c9a6','#c89a76','#8d5a3b','#f5d6b8','#a86f4a'];
const fill16=(a,b,fn)=>Array.from({length:16},(_,j)=>Array.from({length:16},(_,i)=>fn(i,j)?b:a).join(''));
const f3=fn=>Array.from({length:16},(_,j)=>Array.from({length:16},(_,i)=>fn(i,j)).join(''));
const pad16=rows=>Array.from({length:16},(_,j)=>(rows[j]||'').padEnd(16,'.').slice(0,16));
const TILES={};
function makeTiles(){
  const floor=fill16('d','a',(i,j)=>(i*7+j*13)%37===0);
  TILES['.']=sprite(floor,{d:'#2b2f3c', a:'#343848'});
  TILES['#']=sprite(Array(16).fill("bbbbbbbbbbbbbbbb").map((r,i)=>i<3?"BBBBBBBBBBBBBBBB":r), {b:'#1a1d27', B:'#30354a'});
  const win=[]; for (let j=0;j<16;j++){ let r=''; for (let i=0;i<16;i++){ r += (j<2||j>13||i===0||i===15)?'f':((i*7+j*3)%11===0&&j>4?'y':(j>9?'c':'n')); } win.push(r); }
  TILES['W']=sprite(win,{f:'#30354a', n:'#101a33', c:'#1a2446', y:'#f5c542'});
  TILES['G']=sprite(Array(16).fill("gggggggggggggggg").map((r,i)=>i%6===0?"GGGGGGGGGGGGGGGG":r), {g:'#2c3f5a', G:'#4b6b93'});
  const desk=["dddddddddddddddd","dddddddddddddddd","dd..mmmm..mmmm.d","dd..mkkm..mkkm.d","dd..mkkm..mkkm.d","dd..mmmm..mmmm.d","dd....w....w...d","doooooooooooooood","doooooooooooooood","doooooooooooooood","dd.o..........od","dd.o..........od","dd..............","dd..............","dddddddddddddddd","dddddddddddddddd"];
  TILES['D']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#3ddc84', w:'#555', o:'#8a6a4a'});
  TILES['d']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#f5c542', w:'#555', o:'#a37a52'});
  TILES['P']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#4ea1ff', w:'#555', o:'#5a3d2a'});
  TILES['K']=sprite(Array(16).fill("kkkkkkkkkkkkkkkk").map((r,i)=>i<5?"llllllllllllllll":i<7?"kkkkkkkkkkkkkkkk":r),{k:'#4a4f5c', l:'#aab4c8'});
  TILES['C']=sprite(["kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrryyrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrr..rrrrkkk","kkkrrrr..rrrrkkk","kkkrrrrwwrrrrkkk","kkkrrrrwwrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk"],{k:'#4a4f5c', r:'#8a2b2b', y:'#f5c542', w:'#eee', '.':'#2b2f3c'});
  TILES['T']=sprite(["dddddddddddddddd","dddddddddddddddd","dmmmmmmmmmmmmmmd","dmoooooooooooomd","dmoyyyooooyyoomd","dmooooyyyooooomd","dmoyyooooooyyomd","dmooooooyyyooomd","dmmmmmmmmmmmmmmd","dddddwwwwwwddddd","dddddddwwddddddd","dddddddwwddddddd","dddddwwwwwwddddd","dddddddddddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', m:'#111', o:'#101a1a', y:'#f5a623', w:'#555'});
  TILES['E']=sprite(Array(16).fill("eeeeeeeeeeeeeeee").map((r,i)=>i<2?"BBBBBBBBBBBBBBBB":"eeeeeeeeeeeeeeee").map(r=>r.slice(0,7)+'|'+r.slice(8)),{e:'#6a7290', B:'#f5c542', '|':'#2b2f3c'});
  TILES['b']=sprite(["dddddddddddddddd","oooooooooooooooo","oRRoNNoHHooRRooo","oRRoNNoHHooRRooo","oRRoNNoHHooRRooo","oooooooooooooooo","oNNoRRooHHoNNooo","oNNoRRooHHoNNooo","oNNoRRooHHoNNooo","oooooooooooooooo","oHHooNNoRRoHHooo","oHHooNNoRRoHHooo","oHHooNNoRRoHHooo","oooooooooooooooo","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', o:'#5a3d2a', R:'#b43a3a', N:'#4a6fb0', H:'#e7c36b'});
  TILES['p']=sprite(["dddddddddddddddd","dddddddddddddddd","ddddddggggdddddd","dddddgggggggdddd","ddddgggggggggddd","ddddggggggggggdd","dddddgggggggdddd","ddddddggggdddddd","dddddddggddddddd","dddddddggddddddd","ddddddoooodddddd","ddddddoooodddddd","dddddddooddddddd","dddddddooddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', g:'#3f8a5a', o:'#8a5a3a'});
  // office extras: post trolley, printer, the junior's stool
  TILES['m']=sprite(pad16(["","","..gggggggggg....","..gwwrwwgwwg....","..gwwwwwgwwg....","..gggggggggg....","..g........g....","..g........g....","..gggggggggg....","..gwwwwwwwwg....","..gggggggggg....","...kk....kk.....","...kk....kk....."]),{g:'#8a8f9c', w:'#e8e2d0', k:'#2b2f3c', r:'#b43a3a', '.':'#2b2f3c'});
  TILES['Q']=sprite(pad16(["","","....wwwwwwww....","...gggggggggg...","...gGGGGGGGGg...","...gGGGGGGGGg...","...gggggggggg...","...gkkkkkkkkg...","...gggglgggg....","...gggggggggg...","...gggggggggg...","....wwwwwwww...."]),{g:'#6a6f7e', G:'#8a8f9c', w:'#e8e2d0', k:'#111', l:'#5ee28a', '.':'#2b2f3c'});
  TILES['J']=sprite(pad16(["","","...wwwwwwwww....","...wyywwwwww....","...wwwwwwwww....","....oooooo......","....oooooo......",".....o..o.......",".....o..o.......",".....o..o.......","....kk..kk......"]),{o:'#8a6a4a', w:'#e8e2d0', y:'#f5c542', k:'#2b2f3c', '.':'#2b2f3c'});
  // home
  TILES['r']=sprite(fill16('a','b',(i,j)=>(i+j)%4===0),{a:'#5a3a3a', b:'#6b4444'});
  TILES['z']=sprite(["dddddddddddddddd","dwwwwwwwwwwwwwwd","dwwwwwwwwwwwwwwd","dwwllllllllllwwd","dwwllllllllllwwd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dddddddddddddddd","doodddddddddoodd","doodddddddddoodd"],{d:'#2b2f3c', w:'#e8e2d0', l:'#c9c2ae', n:'#3b4a7a', o:'#5a3d2a'});
  TILES['l']=sprite(["dddddddddddddddd","dddddddddddddddd","dddddmmmmmmddddd","dddddmkkkkmddddd","dddddmkkkkmddddd","dddddmmmmmmddddd","dooooooooooooood","dooooooooooooood","dooooooooooooood","dooooooooooooood","dooddddddddddood","dooddddddddddood","dooddddddddddood","dddddddddddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', m:'#111', k:'#4ea1ff', o:'#8a6a4a'});
  TILES['F']=sprite(["dddddddddddddddd","dllllllllllllldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlllllllllllllld","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dllllllllllllldd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', l:'#8a8f9c', w:'#d8dce6'});
  // outdoors, the nice kind
  TILES['g']=sprite(fill16('g','G',(i,j)=>(i*5+j*11)%23===0),{g:'#2f5a3a', G:'#3a6a44'});
  TILES['t']=sprite(["gggggggggggggggg","ggggggGGGGgggggg","gggggGGGGGGggggg","ggggGGGGGGGGgggg","gggGGGGGGGGGGggg","gggGGGGGGGGGGggg","gggGGGGGGGGGGggg","ggggGGGGGGGGgggg","gggggGGGGGGggggg","ggggggGGGGgggggg","gggggggoogggggg","gggggggoogggggg","gggggggoogggggg","gggggggoogggggg","gggggggggggggggg","gggggggggggggggg"].map(r=>r.padEnd(16,'g')),{g:'#2f5a3a', G:'#1f6b3a', o:'#5a3d2a'});

/* ---------- reading & insights. learn() raises a topic; sometimes an insight falls out. ---------- */
function maybeInsight(topic, src){ const open=S.insights.filter(i=>i.status==='new').length; if (open>=3) return null;
  const p=0.16+0.025*S.know[topic]+(src==='paper'?0.12:0); if (rnd()>p) return null;
  const k=pick(TICK); const truth=Math.abs(S.drift[k.t])<0.002?(rnd()<0.5?1:-1):Math.sign(S.drift[k.t]);
  const acc=clamp(0.55+0.035*S.know[topic]+0.03*S.stats.analysis,0.5,0.92); const dir=rnd()<acc?truth:-truth;
  const tpl=pick(INSIGHT_TEXT[topic][dir>0?'pos':'neg']);
  const ins={id:S.day+'-'+k.t+'-'+Math.floor(rnd()*1e6), tk:k.t, dir, topic, text:tpl.replace(/\{n\}/g,k.n).replace(/\{t\}/g,k.t), day:S.day, status:'new'};
  S.insights.push(ins); if (S.insights.length>40){ const i=S.insights.findIndex(x=>x.status!=='new'&&x.status!=='pitched'); if (i>=0) S.insights.splice(i,1); }
  gainXp(10); return ins; }
function learn(topic, n, src){ const lvl=S.know[topic]||0; const gain=Math.min(n, 10-lvl); S.know[topic]=lvl+gain; S.reads++; gainXp(8*n);
  let t=gain>0?`+${gain} ${topicName(topic)} (${S.know[topic]}/10).`:`${topicName(topic)} is at 10. You could teach this.`;
  if (gain>0&&rnd()<0.08){ S.stats.analysis++; t+=' Something clicks. +1 Analysis.'; }
  const ins=maybeInsight(topic, src); if (ins) t+=`\n\nINSIGHT: ${ins.text}\n(Pitch it to ${first(BB.staff.mentor.name)} or ${first(BB.staff.boss.name)} at the office.)`;
  return t; }
function readMenu(n, src, choices, cap, capKey){ const used=S.flags.daily[capKey]||0;
  return choices.map(c=>({l:c.l, s:c.s||`+1 ${topicName(c.k)}`, dis:used>=cap, f:()=>{ if (!useEnergy(1)) return; S.flags.daily[capKey]=used+1; say(n, (c.pre||'')+learn(c.k,1,src)); }})); }

let SC=null, NPCS=[];
function buildScene(k, firmId){
  if (k==='home') return {k, rows:S.home.tier>=2?HOME_BIG:HOME_SMALL, buildings:[], name:HOMES[S.home.tier].t};
  if (TOWN[k]) return Object.assign({k, name:TOWN_NAMES[k], cars:[]}, TOWN[k]);
  const f=firmById(firmId); return {k:'office', rows:OFFICE_MAP, buildings:[], firm:f, name:f.name};
}
const tile=(x,y)=>(y<0||y>=SC.rows.length||x<0||x>=SC.rows[0].length)?'#':SC.rows[y][x];
const solid=c=>SOLID.includes(c), interactable=c=>INTERACT.includes(c);
const SHIRT={mentor:'#3f8a5a', rival:'#8a2b2b', quant:'#6f6a8a', compliance:'#8a8f9c', intern:'#eeeeee'};
function spawnNPCs(){ NPCS=[]; if (SC.k!=='office') return; const f=SC.firm; const st=f.staff;
  const mk=(kind, def, x, y, patrol)=>{ const h=hash(def.name); const shirt=kind==='boss'?'#1b1f3a':(SHIRT[def.kind||kind]); return {id:kind, kind:def.kind||kind, name:def.name, role:def.title, x, y, fx:x, fy:y, dir:'down', t:rnd()*100, patrol, frames:charFrames(HAIRS[h%HAIRS.length], shirt, (h>>3)%2?'#1c1a22':'#2b2f3c', SKINS[(h>>5)%SKINS.length])}; };
  NPCS.push(mk('boss', st.boss, 9, 3), mk('mentor', st.mentor, 5, 9, [[5,9],[8,9]]), mk('rival', st.rival, 11, 11, [[11,11],[14,11]]), mk('extra', st.extra, 18, 12)); }
function spawnTraffic(){ const cars=[]; const W=SC.rows[0].length; (SC.lanes||[]).forEach(l=>{ for (let i=0;i<(l.n||2);i++) cars.push({x:rnd()*W, y:l.y, dir:l.dir, sp:(l.bus?1.6:2.4)+rnd()*1.4, kind:(l.bus||rnd()<0.4)?'bus':'cab'}); }); if (SC.boat) cars.push({x:rnd()*W, y:33, dir:1, sp:0.7, kind:'boat'}); return cars; }
function go(k, firmId, x, y, dir){ S.scene={k, firm:firmId||null}; SC=buildScene(k, firmId); spawnNPCs(); SC.cars=spawnTraffic(); P.x=x; P.y=y; P.fx=x; P.fy=y; P.dir=dir||'down'; P.moving=false; P.path=[]; P.after=null; S.player={x,y,dir:P.dir}; resize(); hud(); save(); }
const bldIn=(town,id)=>TOWN[town].buildings.find(b=>b.id===id);
function goHome(){ const p=homePos(); go('home',null,p.x,p.y,'down'); }
function leaveHome(){ const h=HOMES[S.home.tier]; const b=bldIn(h.town,h.bld); go(h.town,null,b.dx,b.dy+1,'down'); }

/* ---------- dialogue system ---------- */
let dlg=null;
const PLAYER_FRAMES=charFrames('#2b1d12','#f5c542','#1c1a22');
function say(npc, text, choices){ dlg={npc}; $('dlg').classList.add('open'); $('dname').textContent=npc?`${npc.name} · ${npc.role}`:'Dave';
  const pc=$('portrait').getContext('2d'); pc.clearRect(0,0,28,28); pc.drawImage((npc||{frames:PLAYER_FRAMES}).frames.portrait,0,0);
  typewrite($('dtext'), text); const c=$('choices'); c.innerHTML='';
  (choices||[{l:'Continue', f:closeDlg}]).forEach(ch=>{ const b=document.createElement('button'); b.innerHTML=ch.l+(ch.s?`<small>${ch.s}</small>`:''); if (ch.cls) b.className=ch.cls; if (ch.dis) b.disabled=true; b.onclick=()=>{ ch.f?ch.f():closeDlg(); }; c.appendChild(b); }); }
function closeDlg(){ dlg=null; $('dlg').classList.remove('open'); $('choices').innerHTML=''; hud(); save(); }
let tw; function typewrite(el, text){ clearTimeout(tw); el.textContent=''; let i=0; const step=()=>{ el.textContent=text.slice(0,++i); if (i<text.length) tw=setTimeout(step, 12); }; step(); el.onclick=()=>{ clearTimeout(tw); el.textContent=text; }; }
const npcByKind=k=>NPCS.find(n=>n.id===k);
function stepBack(){ closeDlg(); P.y++; P.fy=P.y; P.dir='down'; }

/* ---------- the commute: Ashbury -(bus)- Millbrook -(train)- Brayford Junction -(express)- Lombard City ---------- */
let travelling=false;
const sceneIdx=k=>LINE.indexOf(k);
const homeIdx=()=>LINE.indexOf(HOMES[S.home.tier].town);
function fareBetween(a,b){ let f=0; for (let i=Math.min(a,b); i<Math.max(a,b); i++) f+=LEGS[i].fare; return f; }
const hasPass=()=>S.home.pass>=S.day;
const fareText=f=>hasPass()?'season ticket':f===0?'free':'$'+f;
function payFare(f){ if (hasPass()||f===0) return true; if (S.cash<f){ say(null,'You can\'t afford the fare. The inspector on this line has no sense of humour.'); return false; } S.cash-=f; return true; }
const legName=(i,dir)=>dir>0?LEGS[i].out:LEGS[i].back;
function stopDialog(dir, extra){ const i=sceneIdx(SC.k); const dests=[]; for (let j=i+dir; j>=0&&j<LINE.length; j+=dir) dests.push(j);
  const opts=[]; dests.forEach((j,n)=>{ const f=fareBetween(i,j); const home=j===homeIdx(); const via=dests.slice(0,n).map(x=>TOWN_NAMES[LINE[x]]);
    opts.push({l:(j===3?'To work: Lombard City':home?'Home: '+TOWN_NAMES[LINE[j]]:'To '+TOWN_NAMES[LINE[j]])+` (${fareText(f)})`, cls:(j===3||home)?'gold':'', s:via.length?'Change at '+via.join(' and '):'', f:()=>travel(j,false)});
    if (n===dests.length-1&&LEGS.slice(Math.min(i,j),Math.max(i,j)).some(l=>l.mode==='train')) opts.push({l:'… and read on the train (1 energy)', s:S.paper?'You have today\'s Financial Ledger: +1 Macro, +1 Markets, insights likelier.':'The free paper someone left on the seat. Mostly football, some markets.', f:()=>travel(j,true)});
  });
  (extra||[]).forEach(o=>opts.push(o)); opts.push({l:'Wait', f:stepBack}); say(null, STOP_TEXT[SC.k][dir>0?'e':'w'], opts); }
function travel(j, read, then){ const i=sceneIdx(SC.k); const dir=j>i?1:-1; const fare=fareBetween(i,j);
  if (read&&S.energy<1) return say(null,'Too tired to read. You would only stare at the same paragraph.'); if (!payFare(fare)) return; if (read) S.energy--;
  closeDlg(); travelling=true; const stops=[]; for (let k=i+dir; k!==j; k+=dir) stops.push(k); stops.push(j); let n=0;
  const step=()=>{ const k=stops[n++]; const key=LINE[k]; const pos=ARRIVE[key][dir>0?'e':'w']; go(key,null,pos[0],pos[1],'down');
    if (k!==j){ toast(`${TOWN_NAMES[key]} · change for ${legName(dir>0?k:k-1,dir)}`); setTimeout(step, 1100); }
    else { travelling=false; toast(TOWN_NAMES[key]); if (then) return then(); if (read){ const paper=S.paper; S.paper=false; const t=paper?learn('macro',1,'paper')+' '+learn('markets',1,'paper'):learn(rnd()<0.5?'markets':'macro',1,'train'); say(null,(paper?'You read the Financial Ledger cover to cover between stations. ':'You read the free paper over someone\'s shoulder. ')+t); } } };
  step(); }
function tubeMenu(){ const here=SC.tube.find(t=>Math.abs(t.x-P.x)<=1&&Math.abs(t.y-P.y)<=1)||SC.tube[0];
  say(null,`${here.name} Underground. Warm air from below, a busker, the map with the coloured lines. Fare ${fareText(TUBE_FARE)}.`, SC.tube.filter(t=>t!==here).map(t=>({l:`${t.name}`, f:()=>{ if (!payFare(TUBE_FARE)) return; closeDlg(); go('city',null,t.x,t.y+1,'down'); toast(t.name); }})).concat([{l:'Stay above ground', f:closeDlg}])); }

/* ---------- the earnings case (once you are an Analyst; the ticker and the outcome are rolled secretly) ---------- */
function startMission(f){ const ex=(f.rules&&f.rules.exclude)||[]; const k=pick(TICK.filter(x=>!ex.includes(x.t)));
  S.ms={firm:f.id, tk:k.t, stage:1, truth:rnd()<0.5?'beat':'miss', clues:[], earnDay:S.day+3, bet:null, big:false, honest:false}; S.ms.rival=(S.ms.truth==='miss')===(rnd()<0.7)?'short':'long'; S.flags['ms_'+f.id]=true; }
const msHere=()=>S.ms&&S.job&&S.ms.firm===S.job.firm?S.ms:null;
const msTk=()=>tk(S.ms.tk);
function clueText(src){ const m=S.ms, k=msTk(), beat=m.truth==='beat';
  if (src==='mentor') return beat ? `${k.n}? Their CFO left last month and it spooked people. But read the footnotes of the last quarterly: they have bought back their own shares every single week since. Management doesn't buy when it knows it's about to miss.` : `${k.n}? Their CFO left last month. "Personal reasons", they say. Read the latest guidance again: the language went from "strong demand" to "challenging environment". That doesn't happen by accident.`;
  if (src==='quant'){ const clear=S.stats.analysis>=3||S.flags.quantModel; const up=beat!==(!clear&&rnd()<0.35); return (up?`Alternative data on ${k.t}: activity on their biggest line is up 8% this quarter.`:`Alternative data on ${k.t}: activity on their biggest line is down 6% this quarter.`)+(clear?' The data is clean; I have adjusted for seasonality.':' But careful: it is noisy and I haven\'t adjusted for seasonality. I wouldn\'t bet the house on it.'); }
  if (src==='compliance'){ const up=beat!==(S.stats.analysis<3&&rnd()<0.25); return `I read the insider filings so you don't have to. In the window before the blackout, two ${k.t} directors ${up?'bought':'sold'} stock. ${up?'People don\'t buy before bad news.':'People rarely sell before good news.'} Don't quote me.`; }
  if (src==='intern') return `Psst. ${first(SC.firm.staff.rival.name)} was in the kitchen on the phone. Said they're going ${m.rival} ${k.t} "with everything I have". Didn't see me. I think.`;
  if (src==='terminal') return `${k.t}: −12% in a week.\n`+(beat?'Turnover has been low; the selling comes from a few large holders, not broad panic. Short interest is 22%: a lot of people have to buy back if this goes the other way.':'The drop came on heavy volume, and two executives sold shares in the period. Short interest is 22%, and those shorts usually do their homework.');
  if (src==='cafe'){ const reliable=rnd()<(S.stats.charm>=4?0.8:0.65); const up=beat===reliable; return `A sell-side analyst at the next table is on the phone about ${k.n}. "${up?'Channel checks look strong. I think they beat.':'Channel checks are soft. I think they miss.'}" You pretend to read the menu.`; }
}
function addClue(src){ const m=S.ms; if (!m||m.clues.includes(src)) return null; m.clues.push(src); gainXp(12); return clueText(src); }

/* ---------- pitching insights ---------- */
function pitchMenu(n, who){ const news=S.insights.filter(i=>i.status==='new');
  say(n, who==='boss'?'Thirty seconds.':'Go on, then.', news.map(i=>({l:`${i.tk} · ${i.dir>0?'positive':'negative'} (${topicName(i.topic)})`, s:i.text, f:()=>pitch(n,i,who)})).concat([{l:'Never mind', f:closeDlg}])); }
function pitch(n, i, who){ if (!useEnergy(1)) return; i.status='pitched'; i.to=who; i.pday=S.day; i.ppx=S.px[i.tk]; gainXp(10); aff(who,2);
  say(n, who==='boss'?`"${i.text}"\n\nHe doesn't write it down. He doesn't need to.\n\n"Noted. If it's right I'll remember it. If it's wrong I'll remember that too." (Trust +9 if right, −4 if wrong. Three days.)`:`"${i.text}"\n\n${first(SC.firm.staff.mentor.name)} looks at you a moment longer than is comfortable.\n\n"Hm. Write that up in two lines. I'll watch the tape." (Trust +6 if right, −2 if wrong. Three days.)`); }
function promote(n){ const j=S.job, f=SC.firm; j.rank=1; j.frep=10; j.promoDay=S.day; j.pnlQ=0; j.rivalPnl=0; S.rep+=5; gainXp(100); S.flags.promoted=true; save();
  say(n, `${first(f.staff.mentor.name)} has been in here three times about you. ${correctCalls()} calls right, and you read more than half my analysts.\n\nAladin gave you a login this morning. Analyst. ${moneyM(book())} to start with. Lose ${Math.round(f.fireLoss*100)}% of it in a quarter and you are back in the post room.\n\nYour desk is the yellow one. ${first(f.staff.rival.name)} sits next to you and is good. Be better.`, [{l:'Thank you.', f:closeDlg}]); }

/* ---------- NPC dialogue. Order of checks is priority: missions first, then one-offs, then idle lines. ---------- */
const DIALOG={
  boss(n){ const f=SC.firm, j=S.job, m=msHere(), riv=first(f.staff.rival.name), men=first(f.staff.mentor.name);
    if (!j.met){ j.met=true; gainXp(20); return say(n, `You're the junior. Dave. Post at eight, coffee at nine, the morning pack printed and on every desk before the open. Don't touch the terminal, don't talk to ${riv} while he's on the phone, and don't tell me your ideas.\n\nTell ${men}. If she tells me, then we'll talk.`, [{l:'Yes, Mr Flink.', f:closeDlg}, {l:'"I didn\'t take this job to carry post."', s:'Nerve', f:()=>{ if (S.stats.nerve>=3){ trust(3); say(n,'No. You took it because nobody else would have you. But I like that you said it. Trust +3.'); } else { trust(-3); say(n,'Then carry it badly and I\'ll find someone who carries it well. Trust −3.'); } }}]); }

    const news=S.insights.filter(i=>i.status==='new'); const opts=[]; if (news.length) opts.push({l:'Pitch an insight (1 energy)', cls:'gold', s:'Trust and firm reputation if right', f:()=>pitchMenu(n,'boss')});

    c.strokeStyle='#3a4256'; c.lineWidth=1; for (let i=0;i<5;i++){ const y=20+i*70; c.beginPath(); c.moveTo(0,y); c.lineTo(700,y); c.stroke(); }

    const sg=S.signals[k.t]; const strength=Math.abs(sg.v)>0.008?'strong':Math.abs(sg.v)>0.003?'weak':'no';

    const notes=S.insights.filter(i=>i.tk===k.t&&i.status!=='wrong').slice(-2).map(i=>`<br><small>Your notes: ${i.text}</small>`).join('');

  if (j){ if (book()>0){ for (const k of TICK){ const p=S.pos[k.t]*(S.px[k.t]-old[k.t]); pnl+=p; if (S.pos[k.t]) lines.push(`${k.t} ${money(p)}`); } j.pnlQ+=pnl; j.rivalPnl+=book()*(0.0015+0.006*gauss()); if (pnl>0) gainXp(Math.min(30,Math.round(pnl/book()*800))); } j.days++; S.cash+=salary(); }
  const ppnl=TICK.reduce((a,k)=>a+(S.ppos[k.t]||0)*(S.px[k.t]-old[k.t]),0);
  S.day++; S.energy=maxEnergy(); S.flags.daily={};
  let txt=`Overnight: ${j&&j.rank>=1?money(pnl):'no book yet'}${lines.length?'\n'+lines.join('\n'):''}${ppnl?`\nPersonal account ${money(ppnl)}.`:''}${calls.length?'\n\n'+calls.join('\n'):''}${earn}\n\nSalary +${money(salary())}.`;
  if ((S.day-1)%5===0){ const r=HOMES[S.home.tier].rent; S.cash-=r; txt+=` Rent −${money(r)}.`; if (S.cash<-2*r){ S.over='evicted'; goHome(); return gameOver(txt+`\n\nMonday. The landlord is on the stairs with a locksmith. "Two weeks behind. I'm sorry, love." You carry a bin bag of shirts to the bus stop and don't have the fare.`); } if (S.cash<0) txt+=' You are overdrawn.'; }
  if (S.insider&&S.day%3===0&&rnd()<0.35){ S.over='sec'; goHome(); return gameOver(txt+`\n\nTwo people in grey suits are waiting at your desk in the morning. Ingrid stands behind them, looking away.\n\n"We'd like to talk about your trades in ${tk(S.insider.tk).n}."`); }
  txt+=` Day ${S.day}.`;
  if (j&&j.rank>=1){
    if (j.pnlQ<-f.fireLoss*book()){ const t=txt+`\n\n${first(f.staff.boss.name)} calls you in. "Minus ${Math.abs(j.pnlQ/book()*100).toFixed(1)}%. Aladin flagged it before I did." He doesn't shout. "Post room. Monday. We'll see if you can earn it back."`; demote(); return say(null,t); }

  }
  save(); goHome();
  if (j&&j.rank>=1&&j.days%12===0) return say(null, txt, [{l:'To the quarterly review', cls:'gold', f:quarter}]);
  say(null, txt);
}
function demote(){ const j=S.job; j.rank=0; j.trust=10; j.frep=0; j.pnlQ=0; j.rivalPnl=0; j.boost=false; j.cut=false; j.promoDay=S.day; S.rep=Math.max(0,S.rep-8); if (S.ms) S.ms=null; S.insider=null; for (const k of TICK) S.pos[k.t]=0; S.flags.demoted=(S.flags.demoted||0)+1; save(); goHome(); }
function quarter(){
  const f=firm(), j=S.job, b=book(); const you=j.pnlQ/b*100, riv=j.rivalPnl/b*100, beat=j.pnlQ>j.rivalPnl;

  let text=`Quarterly review at ${f.name}.\nYou: ${pct(you)} · ${first(f.staff.rival.name)}: ${pct(riv)}.\nFirm reputation ${delta>=0?'+':''}${delta} → ${j.frep}.`;
  const bonus=Math.max(0,j.pnlQ*f.bonus); S.cash+=bonus; text+=bonus?`\nBonus ${money(bonus)}.`:f.bonus?'\nNo bonus this quarter.':'\nThis firm pays no bonus. You knew that.';
  let down=false;
  const need=j.rank<TOP?Math.round(RANKS[j.rank+1].rep*f.promo):null; const certNeed=CERT_FOR_RANK[j.rank+1]||0;
  if (j.rank<TOP&&j.frep>=need&&S.study.cert>=certNeed){ j.rank++; S.rep+=5; gainXp(80); text+=`\n\n"You're ${rankName()} now. ${money(salary())} a day. New book: ${moneyM(Math.min(f.maxBook,f.book*RANKS[j.rank].mult))}."`; }

}

/* ---------- movement & input ---------- */
const P={x:S.player.x, y:S.player.y, fx:S.player.x, fy:S.player.y, dir:S.player.dir||'down', moving:false, path:[], after:null};
const npcAt=(x,y)=>NPCS.find(n=>n.x===x&&n.y===y);
const blocked=(x,y)=>solid(tile(x,y))||!!npcAt(x,y);
function tryMove(dx,dy){ if (dlg||P.moving||travelling) return; P.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down'; const nx=P.x+dx, ny=P.y+dy; if (blocked(nx,ny)) return; P.x=nx; P.y=ny; P.moving=true; }
function facing(){ const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[P.dir]; return {x:P.x+d[0], y:P.y+d[1]}; }
const platformAt=(x,y)=>(SC.platforms||[]).find(p=>y===p.y&&x>=p.x0&&x<=p.x1);
function canAct(){ const f=facing(); const c=tile(f.x,f.y); return !!npcAt(f.x,f.y) || interactable(c) || c==='O' || !!platformAt(f.x,f.y) || (SC.k==='home'&&c==='W'); }
function act(){ if (dlg||travelling) return; const f=facing(); const n=npcAt(f.x,f.y); if (n){ n.dir={left:'right',right:'left',up:'down',down:'up'}[P.dir]; return DIALOG[n.id](n); } const c=tile(f.x,f.y); if (c==='O'||platformAt(f.x,f.y)) return tryMove(f.x-P.x,f.y-P.y); if (interactable(c)||(SC.k==='home'&&c==='W')) interactTile(c); }
function onArrive(){ S.player={x:P.x,y:P.y,dir:P.dir}; if (dlg||travelling) return; const c=tile(P.x,P.y); const pl=platformAt(P.x,P.y); if (c==='O'||pl){ P.path=[]; P.after=null; } if (c==='O'){ const b=SC.buildings.find(b=>b.dx===P.x&&b.dy===P.y); if (b) return doorTrigger(b); } if (pl) return stopDialog(pl.dir); }
const held=new Set();
const KEYS={ArrowUp:'0,-1',ArrowDown:'0,1',ArrowLeft:'-1,0',ArrowRight:'1,0',w:'0,-1',s:'0,1',a:'-1,0',d:'1,0'};
addEventListener('keydown', e=>{ const k=KEYS[e.key]; if (k){ held.add(k); e.preventDefault(); } if (e.key==='Enter'||e.key===' '){ if (dlg){ const first=$('choices').querySelector('button'); if (first&&$('choices').children.length===1) first.click(); } else act(); e.preventDefault(); } if (e.key==='Escape'){ $('sheet').classList.remove('open'); $('mini').classList.remove('open'); } });
addEventListener('keyup', e=>{ const k=KEYS[e.key]; if (k) held.delete(k); });
// tap to walk (BFS)
const cv=$('game'); let view={scale:3, ox:0, oy:0};
cv.addEventListener('pointerdown', e=>{ if (dlg||travelling) return; const r=cv.getBoundingClientRect(); const wx=Math.floor(((e.clientX-r.left)*(cv.width/r.width)/view.scale+view.ox)/T), wy=Math.floor(((e.clientY-r.top)*(cv.height/r.height)/view.scale+view.oy)/T);
  const n=npcAt(wx,wy); const c=tile(wx,wy);
  if (n || interactable(c) || (SC.k==='home'&&c==='W')){ const adj=[[0,1],[0,-1],[1,0],[-1,0]].map(([dx,dy])=>({x:wx+dx,y:wy+dy})).filter(p=>!blocked(p.x,p.y)); const path=adj.map(a=>bfs(P,a)).filter(Boolean).sort((a,b)=>a.length-b.length)[0]; if (path){ P.path=path; P.after={x:wx,y:wy}; } else if (Math.abs(wx-P.x)+Math.abs(wy-P.y)===1){ P.dir=wx<P.x?'left':wx>P.x?'right':wy<P.y?'up':'down'; act(); } return; }
  let tx=wx, ty=wy;
  if (c==='B'){ const b=SC.buildings.find(b=>wx>=b.x&&wx<b.x+b.w&&wy>=b.y&&wy<b.y+b.h); if (b){ if (b.door===false){ if (b.text) say(null,b.text); return; } tx=b.dx; ty=b.dy; } }
  else if ((c==='-'||c==='=')&&(SC.platforms||[]).length){ const p=SC.platforms.slice().sort((a,b)=>Math.abs(a.y-wy)-Math.abs(b.y-wy))[0]; tx=clamp(wx,p.x0,p.x1); ty=p.y; }
  if (!solid(tile(tx,ty))){ const path=bfs(P,{x:tx,y:ty}); if (path) { P.path=path; P.after=null; } } });
function bfs(from,to){ if (from.x===to.x&&from.y===to.y) return []; const q=[[from.x,from.y]], prev=new Map([[from.x+','+from.y,null]]); let steps=0; while(q.length&&steps++<9000){ const [x,y]=q.shift(); for (const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){ const nx=x+dx, ny=y+dy, k=nx+','+ny; if (prev.has(k)||blocked(nx,ny)) continue; prev.set(k,x+','+y); if (nx===to.x&&ny===to.y){ const path=[]; let cur=k; while(cur&&cur!==from.x+','+from.y){ const [px,py]=cur.split(',').map(Number); path.unshift({x:px,y:py}); cur=prev.get(cur); } return path; } q.push([nx,ny]); } } return null; }

/* ---------- render loop ---------- */
const ctx=cv.getContext('2d'); let frame=0, last=performance.now();
function resize(){ const dpr=Math.min(devicePixelRatio||1,3); const w=cv.clientWidth, h=cv.clientHeight; cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr); view.scale=Math.max(2, Math.floor(dpr*w/(12*T))); ctx.imageSmoothingEnabled=false; }
addEventListener('resize',resize);
function update(dt){
  if (!P.moving && !dlg && !travelling){ if (P.path.length){ const n=P.path[0]; if (!blocked(n.x,n.y)){ tryMove(n.x-P.x,n.y-P.y); P.path.shift(); if (!P.path.length && P.after){ const a=P.after; P.after=null; setTimeout(()=>{ P.dir=a.x<P.x?'left':a.x>P.x?'right':a.y<P.y?'up':'down'; act(); }, 160); } } else P.path=[]; }
    else { const h=[...held][0]; if (h){ const [dx,dy]=h.split(',').map(Number); tryMove(dx,dy); } } }
  if (P.moving){ const sp=dt*7; P.fx+=clamp(P.x-P.fx,-sp,sp); P.fy+=clamp(P.y-P.fy,-sp,sp); if (Math.abs(P.fx-P.x)<0.01&&Math.abs(P.fy-P.y)<0.01){ P.fx=P.x; P.fy=P.y; P.moving=false; onArrive(); } }
  for (const n of NPCS){ n.t+=dt; if (n.patrol && !dlg){ if (n.fx===n.x && n.fy===n.y && Math.floor(n.t)%6===0 && n.t%1<dt){ const tgt=n.patrol[Math.floor(n.t/6)%2]; const dx=Math.sign(tgt[0]-n.x), dy=Math.sign(tgt[1]-n.y); const nx=n.x+(dx||0), ny=dx?n.y:n.y+dy; if ((dx||dy)&&!blocked(nx,ny)&&!(nx===P.x&&ny===P.y)){ n.x=nx; n.y=ny; n.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down'; } } const sp=dt*4; n.fx+=clamp(n.x-n.fx,-sp,sp); n.fy+=clamp(n.y-n.fy,-sp,sp); } }
  const W=SC.rows[0].length; for (const c of (SC.cars||[])){ c.x+=c.dir*c.sp*dt; if (c.x>W+3) c.x=-4; if (c.x<-4) c.x=W+3; }
}
const shade=(hex,d)=>{ const n=parseInt(hex.slice(1),16); const f=v=>clamp(v+d,0,255); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; };
// Buildings are drawn as facades by style. Night: lit windows, aircraft lights on the tall ones.
function drawBuilding(b){ const x=b.x*T, y=b.y*T, w=b.w*T, h=b.h*T, hb=hash(b.id), st=b.style||'brick';
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle=b.color; ctx.fillRect(x,y,w,h);
  if (st==='glass'||st==='steel'){
    for (let j=14;j<h-4;j+=6) for (let i=3;i<w-3;i+=5){ const lit=((i*7+j*13+hb)%7)<4; ctx.fillStyle=lit?(st==='steel'?'rgba(200,220,255,.7)':'rgba(245,197,66,.8)'):'rgba(120,160,220,.22)'; ctx.fillRect(x+i,y+j,3,4); }
    ctx.fillStyle='rgba(255,255,255,.07)'; for (let d=-h; d<w+h; d+=22){ ctx.beginPath(); ctx.moveTo(x+d,y); ctx.lineTo(x+d+h*0.6,y+h); ctx.lineTo(x+d+h*0.6+5,y+h); ctx.lineTo(x+d+5,y); ctx.fill(); }
    if (st==='steel'){ ctx.fillStyle='#aab3c8'; for (let i=4;i<w;i+=9) ctx.fillRect(x+i,y,2,h); ctx.fillRect(x,y+h/2,w,2); }
  } else if (st==='stone'){
    ctx.fillStyle=shade(b.color,-35); for (let i=5;i<w-4;i+=10) ctx.fillRect(x+i,y+16,3,h-18);
    for (let j=20;j<h-6;j+=10) for (let i=10;i<w-6;i+=10){ ctx.fillStyle='#161c2a'; ctx.fillRect(x+i,y+j,4,6); if ((i+j+hb)%3){ ctx.fillStyle='rgba(245,197,66,.55)'; ctx.fillRect(x+i+1,y+j+2,2,2); } }
    ctx.fillStyle=shade(b.color,18); ctx.beginPath(); ctx.moveTo(x+2,y+15); ctx.lineTo(x+w/2,y+3); ctx.lineTo(x+w-2,y+15); ctx.fill();
  } else if (st==='gherkin'){
