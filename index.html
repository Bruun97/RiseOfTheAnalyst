<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rise of the Analyst">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="description" content="Pixel-art RPG: from an unemployed graduate in a village bedsit to partner in the financial district of Lombard City.">
<title>Rise of the Analyst</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* One-screen phone game. Pixel canvas on top, RPG dialog box docked at the bottom, d-pad + action button overlay. Night-time city pixel art, bone-white UI chrome. */
:root{ --bg:#0d0f16; --ui:#161a26; --ui2:#222838; --line:#3a4256; --ink:#f1efe6; --ink-2:#a8adbd; --gold:#f5c542; --red:#ff6b6b; --green:#5ee28a;
  --pix:'Silkscreen','Courier New',monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#stage{position:relative;flex:1;min-height:0;background:#0a0c12}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-family:var(--pix);font-size:11px;letter-spacing:.5px}
.hud .box{background:rgba(13,15,22,.85);border:2px solid var(--line);padding:5px 8px;color:var(--ink);white-space:nowrap;box-shadow:2px 2px 0 #000;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hud .box small{color:var(--ink-2);font-size:9px;display:block;overflow:hidden;text-overflow:ellipsis}
.hud .en{color:var(--gold)}
.hud #menuBtn{pointer-events:auto;font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:5px 10px;box-shadow:2px 2px 0 #000;min-height:34px}
.hud .right{display:flex;gap:6px}
#dlg{background:var(--ui);border-top:3px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:10px;flex-direction:column;max-height:58%;overflow:auto}
#dlg.open{display:flex}
.dl{display:flex;gap:10px;align-items:flex-start}
.portrait{width:56px;height:56px;flex:none;border:2px solid var(--line);background:#0a0c12;image-rendering:pixelated}
.dname{font-family:var(--pix);font-size:11px;color:var(--gold);margin:0 0 4px;letter-spacing:.5px}
.dtext{margin:0;font-size:15px;line-height:1.45;min-height:44px;white-space:pre-line}
.choices{display:grid;gap:6px}
.choices button{font:600 14px var(--sans);text-align:left;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:10px 12px;min-height:44px;box-shadow:2px 2px 0 #000}
.choices button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
.choices button.gold{border-color:var(--gold);color:var(--gold)}
.choices button.red{border-color:var(--red);color:var(--red)}
.choices button.green{border-color:var(--green);color:var(--green)}
.choices button:disabled{opacity:.45}
.choices button small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.sheet{position:absolute;inset:0;background:rgba(10,12,18,.94);z-index:9;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}
.sheet.open{display:flex}
.sheet h2{font-family:var(--pix);font-size:14px;color:var(--gold);margin:0 0 8px}
.sheet .close{align-self:flex-end;font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:6px 12px;min-height:36px;margin-bottom:8px}
.statrow{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.statrow .bar{height:10px;background:var(--ui2);border:2px solid var(--line)}
.statrow .bar i{display:block;height:100%;background:var(--gold)}
.statrow button{font-family:var(--pix);font-size:10px;background:var(--gold);color:#2b1d05;border:0;padding:4px 8px;min-height:28px}
.q{border:2px solid var(--line);padding:8px 10px;margin:6px 0;background:var(--ui)}
.q b{display:block;font-size:14px}.q.done{opacity:.5;text-decoration:line-through}
.q small{color:var(--ink-2)}
.pos{font-family:var(--pix);font-size:11px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;margin:6px 0}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);background:var(--ui);border:2px solid var(--gold);color:var(--ink);font-family:var(--pix);font-size:11px;padding:8px 12px;box-shadow:3px 3px 0 #000;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8;max-width:86%;text-align:center}
.toast.show{opacity:1}
.mini{position:absolute;inset:0;background:rgba(10,12,18,.95);z-index:9;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(14px + env(safe-area-inset-bottom,0px));gap:10px;overflow:auto}
.mini.open{display:flex}
.mini canvas{width:100%;height:160px;border:2px solid var(--line);background:#0a0c12;image-rendering:auto}
.mini .read{font-size:14px;border:2px solid var(--line);padding:8px 10px;background:var(--ui)}
.mini .read b{color:var(--gold)}
.mini .top{display:flex;justify-content:space-between;align-items:center}
.mini .top b{font-family:var(--pix);font-size:12px;color:var(--gold)}
.mini .close{font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:6px 12px;min-height:36px}
.tk{display:flex;gap:6px;flex-wrap:wrap}
.tk button{font-family:var(--pix);font-size:11px;background:var(--ui2);color:var(--ink);border:2px solid var(--line);padding:8px 10px;min-height:40px}
.tk button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:2px solid var(--line);background:var(--ui);padding:8px 10px;margin:6px 0;font-size:14px}
.row small{display:block;color:var(--ink-2);font-size:12px}
.row .ok{color:var(--green);font-family:var(--pix);font-size:10px}.row .no{color:var(--red);font-family:var(--pix);font-size:10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0d0f16}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="box"><span id="hDay">Day 1 · Mon</span><small id="hRank">Unemployed</small></div>
      <div class="right"><div class="box"><span class="en" id="hEnergy">●●●●●●●●</span><small>energy</small></div><div class="box"><span id="hCash">$1,500</span><small id="hBook">—</small></div><button id="menuBtn" aria-label="Menu">MENU</button></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="sheet" id="sheet"><button class="close" id="sheetClose">CLOSE</button><div id="sheetBody"></div></div>
    <div class="mini" id="mini"></div>
  </div>
  <div id="dlg"><div class="dl"><canvas class="portrait" id="portrait" width="28" height="28"></canvas><div style="min-width:0;flex:1"><p class="dname" id="dname"></p><p class="dtext" id="dtext"></p></div></div><div class="choices" id="choices"></div></div>
</div>

<script>
(() => {
const KEY='rota.v2', T=16;
const $=id=>document.getElementById(id);
const rnd=()=>Math.random(), gauss=()=>{ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(rnd()*a.length)];
const money=v=>(v<0?'−':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
const moneyM=v=>{ const a=Math.abs(v); const s=a>=1e9?(a/1e9).toFixed(1)+'B':a>=1e6?(a/1e6).toFixed(1)+'M':Math.round(a/1e3)+'k'; return (v<0?'−':'')+'$'+s; };
const pct=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)+'%';
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const hash=s=>{ let h=0; for (const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; };

/* ---------- sprites (pixel art drawn from strings; no image assets) ---------- */
const PAL={ '.':null, k:'#1c1a22', s:'#f0c9a6', S:'#c89a76', h:'#4a2f22', H:'#e7c36b', R:'#b43a3a', w:'#eeeeee', n:'#1f2d4a', N:'#4a6fb0', g:'#3f8a5a', G:'#6f6a8a', y:'#f5c542', b:'#2b2f3c', B:'#8a8f9c', o:'#d08a4a', p:'#8a5a8a', l:'#aab4c8', d:'#2a2d36' };
function sprite(rows, map){ const h=rows.length, w=rows[0].length; const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){ const ch=rows[j][i]; const col=(map&&map[ch])||PAL[ch]; if (col){ x.fillStyle=col; x.fillRect(i,j,1,1); } } return c; }
// character 12x16: hair h, skin s, shirt t, pants q, shoes k. frame: legs apart or together. dir: eyes offset.
function charFrames(hair, shirt, pants, skin){
  const map={h:hair, t:shirt, q:pants, e:'#1c1a22', s:skin||'#f0c9a6', k:'#1c1a22', w:'#eeeeee'};
  const mk=(eyes, legs)=>[
    "....hhhh....","...hhhhhh...","...hhhhhh...","...hsssssh..".replace('sssss', eyes),"...ssssss...","....ssss....","...tttttt...","..tttttttt..","..s.tttt.s..","..s.tttt.s..","....tttt....","....qqqq....","....qqqq....",
    legs==='a'?"...qq..qq...":"....q..q....", legs==='a'?"...kk..kk...":"....k..k....","............"];
  const F={}; const E={down:'sesse', left:'esss.', right:'.ssse', up:'sssss'};
  for (const d in E){ F[d]=[sprite(mk(E[d],'a'),map), sprite(mk(E[d],'t'),map)]; }
  F.portrait = sprite([
    "......hhhhhhhhhhhhhhhh......","....hhhhhhhhhhhhhhhhhhhh....","...hhhhhhhhhhhhhhhhhhhhhh...","...hhhhhhhhhhhhhhhhhhhhhh...","...hhhhhhsssssssssshhhhhh...","...hhhhsssssssssssssshhhh...","...hhhsssssssssssssssshhh...","...hhhsssssssssssssssshhh...","...hhsssssssssssssssssshh...","...hhsssswwessssswwesssshh..","...hhssssweessssswesssssh...","....ssssssssssssssssssss....","....ssssssssssssssssssss....","....sssssssssssssssssss.....","....ssssssssskkksssssss.....",".....ssssssssssssssssss.....","......ssssssssssssssss......",".......sssssssssssss........","........tttttttttttt........",".......tttttttttttttt.......","......tttttttttttttttt......",".....tttttttttttttttttt.....","....tttttttttttttttttttt....","...tttttttttttttttttttttt...","...tttttttttttttttttttttt...","..tttttttttttttttttttttttt..","..tttttttttttttttttttttttt..","..tttttttttttttttttttttttt.."].map(r=>r.padEnd(28,'.').slice(0,28)), map);
  return F;
}
const HAIRS=['#1c1a22','#4a2f22','#e7c36b','#b9b1a3','#d08a4a','#2b1d12','#6b3a2a','#8a8f9c'];
const SKINS=['#f0c9a6','#c89a76','#8d5a3b','#f5d6b8','#a86f4a'];
const fill16=(a,b,fn)=>Array.from({length:16},(_,j)=>Array.from({length:16},(_,i)=>fn(i,j)?b:a).join(''));
const TILES={};
function makeTiles(){
  const floor=fill16('d','a',(i,j)=>(i*7+j*13)%37===0);
  TILES['.']=sprite(floor,{d:'#2b2f3c', a:'#343848'});
  TILES['#']=sprite(Array(16).fill("bbbbbbbbbbbbbbbb").map((r,i)=>i<3?"BBBBBBBBBBBBBBBB":r), {b:'#1a1d27', B:'#30354a'});
  const win=[]; for (let j=0;j<16;j++){ let r=''; for (let i=0;i<16;i++){ r += (j<2||j>13||i===0||i===15)?'f':((i*7+j*3)%11===0&&j>4?'y':(j>9?'c':'n')); } win.push(r); }
  TILES['W']=sprite(win,{f:'#30354a', n:'#101a33', c:'#1a2446', y:'#f5c542'});
  TILES['G']=sprite(Array(16).fill("gggggggggggggggg").map((r,i)=>i%6===0?"GGGGGGGGGGGGGGGG":r), {g:'#2c3f5a', G:'#4b6b93'});
  const desk=["dddddddddddddddd","dddddddddddddddd","dd..mmmm..mmmm.d","dd..mkkm..mkkm.d","dd..mkkm..mkkm.d","dd..mmmm..mmmm.d","dd....w....w...d","doooooooooooooood","doooooooooooooood","doooooooooooooood","dd.o..........od","dd.o..........od","dd..............","dd..............","dddddddddddddddd","dddddddddddddddd"];
  TILES['D']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#3ddc84', w:'#555', o:'#8a6a4a'});
  TILES['d']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#f5c542', w:'#555', o:'#a37a52'});
  TILES['P']=sprite(desk,{d:'#2b2f3c', '.':'#2b2f3c', m:'#111', k:'#4ea1ff', w:'#555', o:'#5a3d2a'});
  TILES['K']=sprite(Array(16).fill("kkkkkkkkkkkkkkkk").map((r,i)=>i<5?"llllllllllllllll":i<7?"kkkkkkkkkkkkkkkk":r),{k:'#4a4f5c', l:'#aab4c8'});
  TILES['C']=sprite(["kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrryyrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrr..rrrrkkk","kkkrrrr..rrrrkkk","kkkrrrrwwrrrrkkk","kkkrrrrwwrrrrkkk","kkkrrrrrrrrrrkkk","kkkrrrrrrrrrrkkk","kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk"],{k:'#4a4f5c', r:'#8a2b2b', y:'#f5c542', w:'#eee', '.':'#2b2f3c'});
  TILES['T']=sprite(["dddddddddddddddd","dddddddddddddddd","dmmmmmmmmmmmmmmd","dmoooooooooooomd","dmoyyyooooyyoomd","dmooooyyyooooomd","dmoyyooooooyyomd","dmooooooyyyooomd","dmmmmmmmmmmmmmmd","dddddwwwwwwddddd","dddddddwwddddddd","dddddddwwddddddd","dddddwwwwwwddddd","dddddddddddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', m:'#111', o:'#101a1a', y:'#f5a623', w:'#555'});
  TILES['E']=sprite(Array(16).fill("eeeeeeeeeeeeeeee").map((r,i)=>i<2?"BBBBBBBBBBBBBBBB":"eeeeeeeeeeeeeeee").map(r=>r.slice(0,7)+'|'+r.slice(8)),{e:'#6a7290', B:'#f5c542', '|':'#2b2f3c'});
  TILES['b']=sprite(["dddddddddddddddd","oooooooooooooooo","oRRoNNoHHooRRooo","oRRoNNoHHooRRooo","oRRoNNoHHooRRooo","oooooooooooooooo","oNNoRRooHHoNNooo","oNNoRRooHHoNNooo","oNNoRRooHHoNNooo","oooooooooooooooo","oHHooNNoRRoHHooo","oHHooNNoRRoHHooo","oHHooNNoRRoHHooo","oooooooooooooooo","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', o:'#5a3d2a', R:'#b43a3a', N:'#4a6fb0', H:'#e7c36b'});
  TILES['p']=sprite(["dddddddddddddddd","dddddddddddddddd","ddddddggggdddddd","dddddgggggggdddd","ddddgggggggggddd","ddddggggggggggdd","dddddgggggggdddd","ddddddggggdddddd","dddddddggddddddd","dddddddggddddddd","ddddddoooodddddd","ddddddoooodddddd","dddddddooddddddd","dddddddooddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', g:'#3f8a5a', o:'#8a5a3a'});
  // home
  TILES['r']=sprite(fill16('a','b',(i,j)=>(i+j)%4===0),{a:'#5a3a3a', b:'#6b4444'});
  TILES['z']=sprite(["dddddddddddddddd","dwwwwwwwwwwwwwwd","dwwwwwwwwwwwwwwd","dwwllllllllllwwd","dwwllllllllllwwd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dnnnnnnnnnnnnnnd","dddddddddddddddd","doodddddddddoodd","doodddddddddoodd"],{d:'#2b2f3c', w:'#e8e2d0', l:'#c9c2ae', n:'#3b4a7a', o:'#5a3d2a'});
  TILES['l']=sprite(["dddddddddddddddd","dddddddddddddddd","dddddmmmmmmddddd","dddddmkkkkmddddd","dddddmkkkkmddddd","dddddmmmmmmddddd","dooooooooooooood","dooooooooooooood","dooooooooooooood","dooooooooooooood","dooddddddddddood","dooddddddddddood","dooddddddddddood","dddddddddddddddd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', m:'#111', k:'#4ea1ff', o:'#8a6a4a'});
  TILES['F']=sprite(["dddddddddddddddd","dllllllllllllldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlllllllllllllld","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dlwwwwwwwwwwwldd","dllllllllllllldd","dddddddddddddddd","dddddddddddddddd"],{d:'#2b2f3c', l:'#8a8f9c', w:'#d8dce6'});
  // outdoors
  TILES['g']=sprite(fill16('g','G',(i,j)=>(i*5+j*11)%23===0),{g:'#2f5a3a', G:'#3a6a44'});
  TILES['t']=sprite(["gggggggggggggggg","ggggggGGGGgggggg","gggggGGGGGGggggg","ggggGGGGGGGGgggg","gggGGGGGGGGGGggg","gggGGGGGGGGGGggg","gggGGGGGGGGGGggg","ggggGGGGGGGGgggg","gggggGGGGGGggggg","ggggggGGGGgggggg","gggggggoogggggg","gggggggoogggggg","gggggggoogggggg","gggggggoogggggg","gggggggggggggggg","gggggggggggggggg"].map(r=>r.padEnd(16,'g')),{g:'#2f5a3a', G:'#1f6b3a', o:'#5a3d2a'});
  TILES['S']=sprite(fill16('s','S',(i,j)=>i===15||j===15),{s:'#5a5f6e', S:'#4a4f5c'});
  TILES['R']=sprite(fill16('r','r',()=>false),{r:'#23252e'});
  TILES['M']=sprite(fill16('r','y',(i,j)=>j===0&&i>=2&&i<=9),{r:'#23252e', y:'#9a8a3a'});
  TILES['~']=sprite(fill16('w','W',(i,j)=>(i*3+j*7)%19===0),{w:'#15304a', W:'#1f4668'});
  TILES['q']=sprite(fill16('s','S',(i,j)=>j>=13),{s:'#4a4f5c', S:'#15304a'});
  TILES['B']=sprite(fill16('b','b',()=>false),{b:'#14161f'});
  TILES['O']=TILES['B'];
  TILES['-']=sprite(fill16('g','r',(i,j)=>j===5||j===10||(i%4===0)),{g:'#3a3a32', r:'#6a6a60'});
  TILES['=']=sprite(fill16('s','y',(i,j)=>j===0),{s:'#6a6f7e', y:'#c9b84a'});
  TILES['f']=sprite(fill16('g','f',(i,j)=>(i*7+j*5)%17===0),{g:'#2f5a3a', f:'#e07a9a'});
}
makeTiles();

/* ---------- market ---------- */
const TICK=[ {t:'NVX', n:'Novexa Semi', vol:0.028}, {t:'HLX', n:'Helix Bio', vol:0.04}, {t:'MRD', n:'Meridian Bank', vol:0.018}, {t:'ORB', n:'Orbital Freight', vol:0.022}, {t:'KSN', n:'Kestrel Soft', vol:0.025}, {t:'TRD', n:'Trident Energy', vol:0.03}, {t:'AUR', n:'Aurora Retail', vol:0.024}, {t:'ZNT', n:'Zenith Pharma', vol:0.035} ];
const tk=t=>TICK.find(k=>k.t===t);

/* ---------- firms. All fictional; any resemblance to real institutions is parody. ----------

// Buildings are rectangles drawn over the base grid; the door is the bottom-centre tile. Stepping on a door triggers it.
function mkCity(){
  const W=44, H=29; const g=Array.from({length:H},()=>Array(W).fill('g'));
  const fillRow=(y,c)=>{ for (let x=0;x<W;x++) g[y][x]=c; };
  [1,2,3,4,5,8,9,10,11,12,13,16,17,18,19,20,21,24].forEach(y=>fillRow(y,'S'));
  [6,14,22].forEach(y=>fillRow(y,'R')); [7,15,23].forEach(y=>fillRow(y,'M'));
  for (let x=0;x<W;x++){ if (x%3===1) g[0][x]='t'; if (x%4===2) g[25][x]='t'; else if (x%4===0) g[25][x]='f'; g[26][x]='q'; g[27][x]='~'; g[28][x]='~'; }
  const slots=[['station','cafe','barkleys','brickhouse','afa','hampshire'],['german','hbbb','silverman','blackboulder','rearguard','northsea'],['halloran','riverbridge','reformation','bastion','park','park']];
  const B=[];
  slots.forEach((row,r)=>row.forEach((id,k)=>{ const x=1+k*7, y=1+r*8;
    if (id==='park'){ for (let j=0;j<4;j++) for (let i=0;i<6;i++) g[y+j][x+i]=(i+j)%3===0?'t':(i*j)%5===1?'f':'g'; return; }
    const f=firmById(id); const b={id, x, y, w:6, h:4, kind:f?'firm':id, label:f?f.short:{station:'STATION',cafe:'CAFE',afa:'AFA INSTITUTE'}[id], color:f?f.color:{station:'#3a4a3a',cafe:'#6b3a2a',afa:'#5a4a7a'}[id]};
    for (let j=0;j<4;j++) for (let i=0;i<6;i++) g[y+j][x+i]='B'; b.dx=x+3; b.dy=y+3; g[b.dy][b.dx]='O'; B.push(b); }));
  return {rows:g.map(r=>r.join('')), buildings:B};
}
function mkVillage(){
  const W=26, H=16; const g=Array.from({length:H},()=>Array(W).fill('g'));
  for (let x=0;x<W;x++){ if (x%3===0) g[0][x]='t'; g[1][x]='-'; g[2][x]='='; g[3][x]='S'; g[8][x]='S'; g[9][x]='R'; g[10][x]='M'; g[11][x]='S'; if (x%5===2&&x>10) g[13][x]='t'; if (x%4===1) g[14][x]='f'; if (x%6===3) g[15][x]='t'; }
  for (let y=12;y<=13;y++) for (let x=3;x<=7;x++) g[y][x]='~';
  for (let y=4;y<=7;y++) for (let x=0;x<W;x++) g[y][x]=(x*y)%7===0?'f':'g';
  const B=[ {id:'home',x:2,y:4,w:6,h:4,kind:'home',label:'HOME',color:'#5a4a3a'}, {id:'pub',x:10,y:4,w:6,h:4,kind:'pub',label:'THE CROWN',color:'#4a2a2a'}, {id:'lib',x:18,y:4,w:6,h:4,kind:'lib',label:'LIBRARY',color:'#3a4a5a'} ];
  for (const b of B){ for (let j=0;j<b.h;j++) for (let i=0;i<b.w;i++) g[b.y+j][b.x+i]='B'; b.dx=b.x+3; b.dy=b.y+b.h-1; g[b.dy][b.dx]='O'; }
  return {rows:g.map(r=>r.join('')), buildings:B, platform:{x0:9,x1:16,y:2}};
}

const book=()=>{ const f=firm(); if (!f) return 0; return Math.min(f.maxBook, f.book*RANKS[S.job.rank].mult)*(S.job.boost?1.25:1)*(S.job.cut?0.5:1); };
const maxEnergy=()=>HOMES[S.home.tier].energy;
const xpNeed=()=>S.lvl*80;
function gainXp(n){ S.xp+=n; while (S.xp>=xpNeed()){ S.xp-=xpNeed(); S.lvl++; S.pts++; toast(`LEVEL ${S.lvl}! +1 stat point (MENU)`); } }
function useEnergy(n){ if (S.energy<n){ toast('Too tired. Go home and sleep.'); return false; } S.energy-=n; hud(); return true; }
const affKey=kind=>S.job?S.job.firm+':'+kind:'x:'+kind;
const aff=(kind,n)=>{ const k=affKey(kind); S.aff[k]=clamp((S.aff[k]||0)+n,-100,100); };
const affOf=kind=>S.aff[affKey(kind)]||0;
const netWorth=()=>S.cash+TICK.reduce((a,k)=>a+(S.ppos[k.t]||0)*S.px[k.t],0);
// what a firm requires, as a list of {t, ok}
function reqs(f){ const r=f.req||{}, out=[];
  if (r.cert) out.push({t:`AFA level ${r.cert}`, ok:S.study.cert>=r.cert});
  if (r.rep) out.push({t:`Reputation ${r.rep}`, ok:S.rep>=r.rep});
  for (const st of ['analysis','charm','nerve']) if (r[st]) out.push({t:`${st[0].toUpperCase()+st.slice(1)} ${r[st]}`, ok:S.stats[st]>=r[st]});
  return out; }
const qualifies=f=>reqs(f).every(x=>x.ok);

/* ---------- quests (derived from state, so they never desync) ---------- */
const QUESTS=[
  {id:'job', t:'Get a job', d:'Take the train to Lombard City and apply. Brickhouse Trading takes anyone.', done:s=>!!s.job||s.cv.length>0},
  {id:'first', t:'First research', d:'Sit at your desk (the yellow one) and research a stock.', done:s=>s.flags.researched},
  {id:'trade', t:'First trade', d:'Take a position after your research.', done:s=>s.flags.traded},
  {id:'quarter', t:'Survive a quarter', d:'Beat your rival on P&L before the quarterly review (every 12 working days).', done:s=>s.flags.q1},
  {id:'afa1', t:'Pass AFA level I', d:'Study at home or in the library, then sit the exam at the AFA Institute in the city. Opens the banks.', done:s=>s.study.cert>=1},
  {id:'afa2', t:'Pass AFA level II', d:'Needed by Silverman Sachs and the North Sea Sovereign Fund.', done:s=>s.study.cert>=2, show:s=>s.study.cert>=1},
  {id:'ms', t:'The earnings case', d:'Your boss wants a view before the report. Collect clues from colleagues, the terminal and the café, then decide at your desk.', done:s=>s.ms&&s.ms.stage>=3, show:s=>!!s.ms},
  {id:'home', t:'Move somewhere better', d:'Use the laptop. A better flat gives more energy per day.', done:s=>s.home.tier>=1},
  {id:'big', t:'Join a big firm', d:'A firm with a ceiling of $100M or more. Big firms pay less at the start but go much further.', done:s=>s.cv.concat(s.job?[s.job.firm]:[]).some(id=>firmById(id).maxBook>=1e8)},
  {id:'top', t:'Reach the top', d:'Become Partner, Managing Director or CIO somewhere with a real book. Or start your own fund.', done:s=>s.over==='won'},
];

/* ---------- scenes ---------- */
let SC=null, NPCS=[];
function buildScene(k, firmId){
  if (k==='home') return {k, rows:HOME_MAP, buildings:[], name:HOMES[S.home.tier].t};
  if (k==='village') return {k, rows:VILLAGE.rows, buildings:VILLAGE.buildings, platform:VILLAGE.platform, name:'Ashbury'};
  if (k==='city') return {k, rows:CITY.rows, buildings:CITY.buildings, name:'Lombard City'};
  const f=firmById(firmId); return {k:'office', rows:OFFICE_MAP, buildings:[], firm:f, name:f.name};
}
const tile=(x,y)=>(y<0||y>=SC.rows.length||x<0||x>=SC.rows[0].length)?'#':SC.rows[y][x];
const solid=c=>SOLID.includes(c), interactable=c=>INTERACT.includes(c);
const SHIRT={mentor:'#3f8a5a', rival:'#8a2b2b', quant:'#6f6a8a', compliance:'#8a8f9c', intern:'#eeeeee'};
function spawnNPCs(){ NPCS=[]; if (SC.k!=='office') return; const f=SC.firm; const st=f.staff;
  const mk=(kind, def, x, y, patrol)=>{ const h=hash(def.name); const shirt=kind==='boss'?f.color:(SHIRT[def.kind||kind]); return {id:kind, kind:def.kind||kind, name:def.name, role:def.title, x, y, fx:x, fy:y, dir:'down', t:rnd()*100, patrol, frames:charFrames(HAIRS[h%HAIRS.length], shirt, (h>>3)%2?'#1c1a22':'#2b2f3c', SKINS[(h>>5)%SKINS.length])}; };
  NPCS.push(mk('boss', st.boss, 9, 3), mk('mentor', st.mentor, 5, 9, [[5,9],[8,9]]), mk('rival', st.rival, 11, 11, [[11,11],[14,11]]), mk('extra', st.extra, 18, 12)); }
function go(k, firmId, x, y, dir){ S.scene={k, firm:firmId||null}; SC=buildScene(k, firmId); spawnNPCs(); P.x=x; P.y=y; P.fx=x; P.fy=y; P.dir=dir||'down'; P.moving=false; P.path=[]; P.after=null; S.player={x,y,dir:P.dir}; resize(); hud(); save(); }
const cityDoor=id=>CITY.buildings.find(b=>b.id===id);

/* ---------- dialogue system ---------- */
let dlg=null;
const PLAYER_FRAMES=charFrames('#2b1d12','#f5c542','#1c1a22');
function say(npc, text, choices){ dlg={npc}; $('dlg').classList.add('open'); $('dname').textContent=npc?`${npc.name} · ${npc.role}`:'Dave';
  const pc=$('portrait').getContext('2d'); pc.clearRect(0,0,28,28); pc.drawImage((npc||{frames:PLAYER_FRAMES}).frames.portrait,0,0);
  typewrite($('dtext'), text); const c=$('choices'); c.innerHTML='';
  (choices||[{l:'Continue', f:closeDlg}]).forEach(ch=>{ const b=document.createElement('button'); b.innerHTML=ch.l+(ch.s?`<small>${ch.s}</small>`:''); if (ch.cls) b.className=ch.cls; if (ch.dis) b.disabled=true; b.onclick=()=>{ ch.f?ch.f():closeDlg(); }; c.appendChild(b); }); }
function closeDlg(){ dlg=null; $('dlg').classList.remove('open'); $('choices').innerHTML=''; hud(); save(); }
let tw; function typewrite(el, text){ clearTimeout(tw); el.textContent=''; let i=0; const step=()=>{ el.textContent=text.slice(0,++i); if (i<text.length) tw=setTimeout(step, 12); }; step(); el.onclick=()=>{ clearTimeout(tw); el.textContent=text; }; }
const npcByKind=k=>NPCS.find(n=>n.id===k);
const first=n=>n.split(' ').filter(w=>!w.endsWith('.'))[0];

/* ---------- the earnings case (one per firm; the ticker and the outcome are rolled secretly) ---------- */
function startMission(f){ const ex=(f.rules&&f.rules.exclude)||[]; const k=pick(TICK.filter(x=>!ex.includes(x.t)));
  S.ms={firm:f.id, tk:k.t, stage:1, truth:rnd()<0.5?'beat':'miss', clues:[], earnDay:S.day+3, bet:null, big:false, honest:false}; S.ms.rival=(S.ms.truth==='miss')===(rnd()<0.7)?'short':'long'; S.flags['ms_'+f.id]=true; }
const msHere=()=>S.ms&&S.job&&S.ms.firm===S.job.firm?S.ms:null;
const msTk=()=>tk(S.ms.tk);
function clueText(src){ const m=S.ms, k=msTk(), beat=m.truth==='beat';
  if (src==='mentor') return beat ? `${k.n}? Their CFO left last month and it spooked people. But read the footnotes of the last quarterly: they have bought back their own shares every single week since. Management doesn't buy when it knows it's about to miss.` : `${k.n}? Their CFO left last month. "Personal reasons", they say. Read the latest guidance again: the language went from "strong demand" to "challenging environment". That doesn't happen by accident.`;
  if (src==='quant'){ const clear=S.stats.analysis>=3||S.flags.quantModel; const up=beat!==(!clear&&rnd()<0.35); return (up?`Alternative data on ${k.t}: activity on their biggest line is up 8% this quarter.`:`Alternative data on ${k.t}: activity on their biggest line is down 6% this quarter.`)+(clear?' The data is clean; I have adjusted for seasonality.':' But careful: it is noisy and I haven\'t adjusted for seasonality. I wouldn\'t bet the house on it.'); }
  if (src==='compliance'){ const up=beat!==(S.stats.analysis<3&&rnd()<0.25); return `I read the insider filings so you don't have to. In the window before the blackout, two ${k.t} directors ${up?'bought':'sold'} stock. ${up?'People don\'t buy before bad news.':'People rarely sell before good news.'} Don't quote me.`; }
  if (src==='intern') return `Psst. ${first(SC.firm.staff.rival.name)} was in the kitchen on the phone. Said they're going ${m.rival} ${k.t} "with everything I have". Didn't see me. I think.`;
  if (src==='terminal') return `${k.t}: −12% in a week.\n`+(beat?'Turnover has been low; the selling comes from a few large holders, not broad panic. Short interest is 22%: a lot of people have to buy back if this goes the other way.':'The drop came on heavy volume, and two executives sold shares in the period. Short interest is 22%, and those shorts usually do their homework.');
  if (src==='cafe'){ const reliable=rnd()<(S.stats.charm>=4?0.8:0.65); const up=beat===reliable; return `A sell-side analyst at the next table is on the phone about ${k.n}. "${up?'Channel checks look strong. I think they beat.':'Channel checks are soft. I think they miss.'}" You pretend to read the menu.`; }
}
function addClue(src){ const m=S.ms; if (!m||m.clues.includes(src)) return null; m.clues.push(src); gainXp(12); return clueText(src); }

/* ---------- NPC dialogue, generic over firms. Order of checks is priority: missions first, then one-offs, then idle lines. ---------- */
const DIALOG={
  boss(n){ const f=SC.firm, j=S.job, m=msHere(), riv=first(f.staff.rival.name);
    if (!j.met){ j.met=true; gainXp(20); return say(n, `So you're the new one. Dave, right? ${moneyM(book())} to start with. Lose it and you're out. Make money and we'll talk again.\n\nYour desk is the yellow one. ${riv} sits next to you and is good. Be better.`, [{l:'Understood.', f:closeDlg}, {l:`"${moneyM(book())} isn't much."`, s:'Nerve', f:()=>{ if (S.stats.nerve>=3){ aff('boss',5); j.frep+=3; say(n,'Ha. Cheeky. I like it, if you can back it up.'); } else { aff('boss',-5); say(n,'Then go and turn it into twice as much. Then we talk.'); } }}]); }
    if (j.days>=2 && !S.ms && !S.flags['ms_'+f.id]){ startMission(f); const k=msTk(); gainXp(15);
      return say(n, `${k.n}. ${k.t}. They report in three days and the stock is down 12% in a week. Everyone has an opinion, nobody knows anything.\n\nFind out what's going on. ${first(f.staff.mentor.name)} knows the company, ${first(f.staff.extra.name)} sees things the rest of us don't, the terminal has the tape, and the café downstairs hears everything. Come back with a view, or a good reason not to have one.`, [{l:'On it.', f:closeDlg}]); }
    if (m && m.stage===2){ m.stage=3; const right=m.bet&&m.bet!=='none'&&((m.bet==='long')===(m.truth==='beat')); let t, d=0;
      if (m.bet==='none'&&m.honest){ d=4; t='You came in and said "I don\'t know" with three clues in your hand. Most people guess and hope. I prefer "don\'t know" to an expensive guess. Next time, though, I want a view.'; }
      else if (!m.bet||m.bet==='none'){ d=-3; t='I asked you to find something out, and you found out how to stay away. That is not the same thing.'; }
      else if (right&&m.big){ d=14; t=`You came to me for firm capital and you were right. ${m.truth==='beat'?'Beat':'Miss'}, exactly as you said. That is how you build a name here.`; aff('boss',15); gainXp(120); if (rnd()<0.5){ S.stats.nerve++; t+='\n\n+1 Nerve.'; } }
      else if (right){ d=9; t=`Right direction, sensible size. ${m.truth==='beat'?'They beat':'They missed'} and you were on the right side. Good work.`; aff('boss',8); gainXp(80); }
      else if (m.big){ d=-10; t='You asked for firm capital and you were wrong. It happens. It must not happen twice.'; aff('boss',-10); }
      else { d=-5; t=`Wrong direction. ${m.clues.length<2?'And you had barely spoken to anyone. ':''}Learn from it.`; }
      j.frep+=d; S.rep+=Math.round(d/2); const rivRight=(m.rival==='long')===(m.truth==='beat'); t+=rivRight?`\n\n${riv} was right, by the way. Again.`:`\n\n${riv} lost a fortune on it. Don't tell them I said so.`;
      return say(n, t+`\n\nFirm reputation ${d>=0?'+':''}${d}.`); }
    if (m && m.stage===1){ if (m.bet==='none'&&m.honest) return say(n,'Noted. We\'ll see what they report.');
      return say(n, `${m.tk} reports in ${m.earnDay-S.day} day(s). What have you got?`, [ ...(m.clues.length>=2&&!m.bet&&S.stats.nerve>=3 ? [{l:'Pitch: let me trade it with firm capital', cls:'gold', s:'Nerve · double the stake, double the consequence', f:()=>{ m.big=true; say(n,'You\'ve got some nerve. Fine. Take your view at your desk and I\'ll double it. Be wrong and we talk.'); }}] : []),
        {l:'"I don\'t know yet."', s:'Honest. Counts as an answer if you have clues.', f:()=>{ if (m.clues.length>=3&&!m.bet){ m.bet='none'; m.honest=true; say(n,'Hm. Three sources and no view. That is either wise or cowardly. We\'ll find out which.'); } else say(n,'Then find out.'); }}, {l:'Still working on it', f:closeDlg}]); }
    if (S.flags.reportPending===f.id){ S.flags.reportPending=null; j.frep+=6; S.rep+=4; aff('boss',10); gainXp(30); return say(n,`${riv} and I have had a conversation. You did the right thing, and I don't forget that.`); }
    if (j.pnlQ<-book()*0.05) return say(n, `You're down ${pct(j.pnlQ/book()*100)} this quarter. I've seen people disappear for less. Fix it.`);
    if (j.pnlQ>book()*0.03&&!j.boost) return say(n, `${pct(j.pnlQ/book()*100)}. Not bad. Keep your head; it's when things go well that people get stupid.`, [{l:'Ask for a bigger book', s:'Charm · chance', f:()=>{ if (rnd()<0.3+S.stats.charm*0.1){ j.boost=true; j.frep+=4; say(n,'Fine. 25% more until the quarterly review. Don\'t disappoint me.'); } else say(n,'No. Show me a whole quarter first.'); }}, {l:'Thanks.', f:closeDlg}]);
    return say(n, pick(f.lines.boss.concat(['What do you want? I have a call in three minutes.'])));
  },
  mentor(n){ const f=SC.firm, m=msHere();
    if (!S.flags['lesson_'+f.id]){ S.flags['lesson_'+f.id]=true; gainXp(25); aff('mentor',10); let t=`Welcome. Let me give you the most important advice in one go: a chart tells you what happened. Research tells you what is happening now. The signal is never clean; it is a probability, not a promise.`; if (!S.flags.firstLesson){ S.flags.firstLesson=true; S.stats.analysis++; t+='\n\n+1 Analysis.'; } return say(n,t); }
    if (m&&m.stage===1&&!m.clues.includes('mentor')) return say(n, addClue('mentor'));
    if (S.energy>=1&&!S.flags.lessonToday) return say(n,'Got half an hour for the whiteboard?', [{l:'Yes (1 energy)', s:'+XP, chance of +Analysis', f:()=>{ if(!useEnergy(1)) return; S.flags.lessonToday=true; gainXp(15); aff('mentor',3); if (rnd()<0.22){ S.stats.analysis++; say(n,'There! You saw it before I did. +1 Analysis.'); } else say(n,'Good. We continue tomorrow.'); }}, {l:'Not now', f:closeDlg}]);
    return say(n, pick(f.lines.mentor.concat(['Close the positions you no longer believe in. Hope is not a strategy.'])));
  },
  rival(n){ const f=SC.firm, j=S.job, m=msHere(); const lead=j.pnlQ-j.rivalPnl;
    if (S.ms&&S.ms.firm===f.id&&S.ms.stage>=2&&!S.flags['msRival_'+f.id]){ S.flags['msRival_'+f.id]=true; const right=(S.ms.rival==='long')===(S.ms.truth==='beat'); j.rivalPnl+=book()*(right?0.07:-0.07);
      return say(n, right?`${S.ms.tk}. Didn't I say so? Oh, right. I didn't say it to you.`:`Don't. Not one word about ${S.ms.tk}.`, [{l:'…', f:closeDlg}, ...(right?[]:[{l:'"With everything you had, I heard."', s:'Nerve · they hate you a little more', f:()=>{ aff('rival',-15); j.frep+=1; say(n,`Who told you that? ${first(f.staff.extra.name)}? I'll kill them.`); }}])]); }
    if (!S.flags['tip_'+f.id]&&j.days>=5&&affOf('rival')>-5){ S.flags['tip_'+f.id]=true; const k=pick(TICK.filter(x=>!S.ms||x.t!==S.ms.tk)); const comp=f.staff.extra.kind==='compliance'?first(f.staff.extra.name)+' in compliance':first(f.staff.boss.name);
      return say(n,`Listen. I have a friend at a law firm. ${k.n} gets bought on Friday. It isn't public. Buy now and we share the credit at the review.`, [{l:`Buy ${k.t} big`, cls:'red', s:'Insider trading. Big win. Risk of the regulator.', f:()=>{ S.insider={firm:f.id, tk:k.t}; S.drift[k.t]=0.08; S.pos[k.t]+=Math.floor(book()*0.4/S.px[k.t]); aff('rival',15); say(n,'Smart. We never spoke.'); }}, {l:'"No. And neither should you."', s:'Nerve', f:()=>{ aff('rival',-20); j.frep+=2; say(n,'Your loss. Literally.'); }}, {l:`Report it to ${comp}`, s:'Reputation ++, your rival hates you', f:()=>{ aff('rival',-50); S.flags.reportPending=f.id; say(n,'…You didn\'t. You did not just do that.'); }}]); }
    return say(n, lead>0? pick(f.lines.rival.concat(['Enjoy it. It won\'t last.','Lucky quarter. I\'ve seen it before.'])) : pick(f.lines.rival.concat([`How's the book? Oh. I saw.`,`I'm up ${pct(j.rivalPnl/book()*100)}. You?`])));
  },
  extra(n){ const f=SC.firm, m=msHere(), kind=n.kind;
    if (S.flags.reportPending===f.id&&kind==='compliance'){ S.flags.reportPending=null; S.job.frep+=6; S.rep+=4; aff('extra',20); gainXp(30); return say(n,`I've spoken to ${first(f.staff.rival.name)}. And to ${first(f.staff.boss.name)}. You did the right thing, and I won't forget it.\n\nIf you're ever unsure about a trade, come to me first.`); }
    if (m&&m.stage===1&&!m.clues.includes('extra')) { m.clues.push('extra'); gainXp(12); return say(n, clueText(kind)); }
    if (kind==='quant'){ if (S.flags.quantModel) return say(n, pick(f.lines.extra.concat(['The model runs. Your signal at the desk is cleaner now.'])));
      const h=S.flags.quantHelp||0; if (h>=2){ S.flags.quantModel=true; gainXp(40); aff('extra',20); return say(n,'Thank you. Here is the access. Your signals are sharper now; see for yourself at your desk.'); }
      return say(n, h?'One more session and I\'ll give you the model.':'I have a drift model. Not perfect, but better than your gut. Help me label two batches of data and you get access.', [{l:'Label data (1 energy)', s:'+XP', f:()=>{ if(!useEnergy(1)) return; S.flags.quantHelp=h+1; gainXp(15); aff('extra',8); say(n, h?'Done. Come back for the access.':'Tedious, isn\'t it? One more.'); }}, {l:'Not now', f:closeDlg}]); }
    if (kind==='compliance'){ if (S.insider&&S.insider.firm===f.id) return say(n,`There is a pattern in the ${S.insider.tk} trades I don't understand. I'm looking into it.`, [{l:'"I had a strong thesis."', s:'Nerve', f:()=>{ if (S.stats.nerve>=4) say(n,'Hm. Send me your notes.'); else { S.insider.suspect=true; say(n,'You blinked. Send me your notes today.'); } }}, {l:'Say nothing', f:closeDlg}]);
      return say(n, pick(f.lines.extra.concat(['The rule is simple: if you wouldn\'t tell your mother, don\'t trade on it.','I sleep well at night. My job is making sure you do too.']))); }
    if (!S.flags['intern_'+f.id]) return say(n,'Hi! Do you know how to do a pivot in pandas? Nobody answers me.', [{l:'Show them (1 energy)', s:'+XP, +relationship', f:()=>{ if(!useEnergy(1)) return; S.flags['intern_'+f.id]=true; aff('extra',20); gainXp(15); say(n,'Wow, thanks! I owe you one.'); }}, {l:'"Google it."', f:()=>{ S.flags['intern_'+f.id]=true; aff('extra',-10); say(n,'…Okay.'); }}]);
    return say(n, pick(f.lines.extra.concat(['Do you think they\'ll keep me after the summer?','The coffee machine is broken again. Or it\'s me.'])));
  }
};

/* ---------- objects & places ---------- */
function interactTile(c){
  if (SC.k==='office'){
    if (c==='d') return deskMenu();
    if (c==='C'){ if ((S.flags.coffee||0)>=2) return say(null,'Any more coffee and you\'ll shake too much to use the mouse.'); S.flags.coffee=(S.flags.coffee||0)+1; S.energy=Math.min(maxEnergy(),S.energy+1); hud(); return say(null,'Coffee. The lever creaks, but it works. +1 energy.'); }
    if (c==='T'){ const m=msHere(); if (m&&m.stage===1&&!m.clues.includes('terminal')) return say(null, addClue('terminal'));
      return say(null, TICK.map(k=>{ const h=S.hist[k.t]; const ch=(h[h.length-1]/h[h.length-2]-1)*100; return `${k.t}  ${S.px[k.t].toFixed(2)}  ${pct(ch)}`; }).join('\n')+`\n\nQuarter P&L: ${money(S.job.pnlQ)} · ${first(SC.firm.staff.rival.name)}: ${money(S.job.rivalPnl)}`); }
    if (c==='E'){ const b=cityDoor(SC.firm.id); return say(null,'The lift. Out into the city, or call it a day? The market trades overnight.', [{l:`Call it a day: train home & sleep (${fareText()})`, cls:'gold', f:()=>{ if (!payFare()) return; endDay(); }}, {l:'Out into the city', f:()=>{ closeDlg(); go('city',null,b.dx,b.dy+1,'down'); }}, {l:'Stay a while', f:closeDlg}]); }
    if (c==='b') return say(null, pick(['"Reminiscences of a Stock Operator". Worn spine.','A binder of compliance rules. Someone has drawn a cartoon in the margin.','Old annual reports. The smell of paper and low interest rates.']));
    if (c==='P') return say(null,`${first(SC.firm.staff.boss.name)}'s desk. Three screens, a photo of a sailing boat and no chairs for visitors.`);
  }
  if (SC.k==='home'){
    if (c==='z') return say(null, `${HOMES[S.home.tier].t}. ${HOMES[S.home.tier].desc}\n\nGo to sleep? The market trades overnight.`, [{l:'Sleep', cls:'gold', f:endDay}, {l:'Not yet', f:closeDlg}]);
    if (c==='l') return laptop();
    if (c==='F'){ if (S.flags.ate) return say(null,'The fridge hums. There is nothing else in it today.'); if (S.cash<8) return say(null,'Half a lemon and a jar of mustard. You can\'t afford groceries.'); S.flags.ate=true; S.cash-=8; S.energy=Math.min(maxEnergy(),S.energy+1); hud(); return say(null,'Beans on toast. $8. +1 energy.'); }
    if (c==='E'){ closeDlg(); const b=VILLAGE.buildings[0]; return go('village',null,b.dx,b.dy+1,'down'); }
    if (c==='W') return say(null, ['Rain on the window. Below, the chip shop queue. Beyond it, the railway line to the city.','The duck pond. A heron. The 7:42 rattling past in the distance.','The river, the mill wheel, the lights of Lombard City far off on the horizon.'][S.home.tier]);
  }
}
const fareText=()=>S.home.pass>=S.day?'season ticket':`$${FARE}`;
function payFare(){ if (S.home.pass>=S.day) return true; if (S.cash<FARE){ say(null,'You can\'t afford a ticket. Beans and dignity, both running low.'); return false; } S.cash-=FARE; return true; }
function doorTrigger(b){
  if (b.kind==='home') return go('home',null,4,6,'up');
  if (b.kind==='station') return say(null,'Lombard City Central. The 17:48 to Ashbury is on platform 2.', [{l:`Train home (${fareText()})`, cls:'gold', f:()=>{ if (!payFare()) return; closeDlg(); go('village',null,12,3,'down'); }}, {l:'Stay in the city', f:()=>{ closeDlg(); P.y++; P.fy=P.y; }}]);
  if (b.kind==='firm') return reception(firmById(b.id), b);
  if (b.kind==='cafe') return cafe();
  if (b.kind==='afa') return institute();
  if (b.kind==='pub') return pub();
  if (b.kind==='lib') return library();
}
function stepBack(){ closeDlg(); P.y++; P.fy=P.y; P.dir='down'; }
function trainToCity(){ say(null,'Ashbury station. One platform, one bench, one timetable from 1998. The 7:42 to Lombard City is due.', [{l:`Take the train (${fareText()})`, cls:'gold', f:()=>{ if (!payFare()) return; closeDlg(); const b=cityDoor('station'); go('city',null,b.dx,b.dy+1,'down'); }}, {l:'Wait', f:()=>{ closeDlg(); P.y++; P.fy=P.y; P.dir='down'; }}]); }

/* reception & interviews */
function reception(f, b){
  const employedHere=S.job&&S.job.firm===f.id;
  if (employedHere){ closeDlg(); return go('office',f.id,9,13,'up'); }
  const rq=reqs(f), ok=qualifies(f), cd=(S.cooldown[f.id]||0)>S.day;
  const lines=rq.length?rq.map(r=>`${r.ok?'✓':'✗'} ${r.t}`).join('\n'):'No formal requirements.';
  const prof=`Salary ${money(f.salary)}/day · book ${moneyM(f.book)} → up to ${moneyM(f.maxBook)} · bonus ${Math.round(f.bonus*100)}% · fired at −${Math.round(f.fireLoss*100)}%`;
  say(null, `${f.name}.\n${f.desc}\n\n${prof}\n\nRequirements:\n${lines}`, [
    ...(S.job ? [{l:`Resign from ${firm().name} and apply here (1 energy)`, cls:'red', s:'One employer at a time. You lose your book and positions. Fail the interview and you are unemployed.', dis:!(ok&&!cd), f:()=>{ if (!useEnergy(1)) return; resign(); interview(f,b); }}, ...(!(ok&&!cd)?[{l: cd?`Come back in ${S.cooldown[f.id]-S.day} day(s)`:'You don\'t qualify yet', dis:true}]:[])] :
      ok&&!cd ? [{l:`Apply (1 energy)`, cls:'gold', s:'Three questions. Stats and a little luck.', f:()=>{ if (!useEnergy(1)) return; interview(f,b); }}] : [{l: cd?`Come back in ${S.cooldown[f.id]-S.day} day(s)`:'You don\'t qualify yet', dis:true}]),
    {l:'Leave', f:stepBack}]);
}
function interview(f, b){ const qs=INTERVIEWS[f.type]; let i=0, score=0; const bossN={name:f.staff.boss.name, role:f.staff.boss.title, frames:charFrames(HAIRS[hash(f.staff.boss.name)%HAIRS.length], f.color, '#1c1a22', SKINS[(hash(f.staff.boss.name)>>5)%SKINS.length])};
  const next=()=>{ if (i>=qs.length) return verdict(); const q=qs[i++];
    say(bossN, q.q, q.a.map(a=>({l:a.l, f:()=>{ const w=f.likes.includes(a.s)?1:0.55; const roll=S.stats[a.s]*w+rnd()*1.6+S.cv.length*0.3; const pass=roll>=f.diff; score+=pass?1:0; toast(pass?'Good answer.':'Hm.'); next(); }}))); };
  const verdict=()=>{ gainXp(15); if (score>=2){ hire(f); return say(bossN, `${score===3?'Best interview I\'ve had all year.':'Good enough.'} You start now. Your desk is the yellow one.`, [{l:'Thank you.', f:()=>{ closeDlg(); go('office',f.id,9,13,'up'); }}]); }
    S.cooldown[f.id]=S.day+5; if (rnd()<0.3){ S.stats.nerve++; toast('+1 Nerve. Rejection builds character.'); } return say(bossN, pick(['We\'ll be in touch. We won\'t, actually.','Not this time. Come back when you\'ve learned something.','Thank you for your time. The lift is to the left.']), [{l:'…', f:stepBack}]); };
  next(); }
function resign(){ const f=firm(); S.cv.push(f.id); S.flags.fromRank=S.job.rank; if (S.ms&&S.ms.firm===f.id) S.ms=null; S.job=null; for (const k of TICK) S.pos[k.t]=0; save(); hud(); }
function hire(f){ if (S.job) resign(); const start=(S.flags.fromRank||0)>=2?1:0; S.flags.fromRank=0;
  S.job={firm:f.id, rank:start, frep:10+Math.min(20,S.cv.length*5), pnlQ:0, rivalPnl:0, days:0, met:false, boost:false, cut:false}; for (const k of TICK) S.pos[k.t]=0; if (S.ms&&S.ms.firm!==f.id) S.ms=null; S.rep+=3; }

/* city café, village pub, library, exam institute */
function cafe(){ const m=msHere();
  say(null,'Café Liquidity. Flat whites, bankers on the phone, and a barista who knows everyone\'s order and everyone\'s bonus.', [
    {l:'Coffee ($6, +1 energy)', s:S.flags.cafeCoffee?'Already had one today':'', dis:!!S.flags.cafeCoffee, f:()=>{ if (S.cash<6) return say(null,'Card declined. The barista pretends not to notice.'); S.cash-=6; S.flags.cafeCoffee=true; S.energy=Math.min(maxEnergy(),S.energy+1); hud(); say(null,'Good coffee. +1 energy.'); }},
    ...(m&&m.stage===1&&!m.clues.includes('cafe')?[{l:'Listen in on the next table', cls:'gold', s:'Earnings case clue', f:()=>say(null, addClue('cafe'))}]:[]),
    {l:'Network (1 energy, $40)', s:'Charm · reputation, maybe +Charm', f:()=>{ if (S.cash<40) return say(null,'Networking costs money. You have none.'); if (!useEnergy(1)) return; S.cash-=40; const r=rnd()*4+S.stats.charm; const d=r>6?3:r>4?2:r>2.5?1:0; S.rep+=d; gainXp(10); let t=d?`You swap cards with a ${pick(['VP from Silverman Sachs','risk manager from BlackBoulder','trader from Bastion','grad from HBBB'])}. Reputation +${d}.`:'You talk to a man who turns out to be a recruiter for a timeshare company. Nothing gained.'; if (rnd()<0.2){ S.stats.charm++; t+=' You are getting better at this. +1 Charm.'; } const hiring=pick(FIRMS); t+=`\n\nOverheard: ${hiring.name} is ${pick(['hiring','losing people','restructuring','having a good year'])}.`; say(null,t); }},
    {l:'Leave', f:stepBack}]); }
function pub(){ say(null,'The Crown & Ledger. Low beams, a fire, and a landlord who used to work "in the City" and will tell you about it.', [
    {l:'Pie and a pint ($12, +1 energy)', dis:!!S.flags.pub, s:S.flags.pub?'Already eaten today':'', f:()=>{ if (S.cash<12) return say(null,'The landlord shakes his head. No tab for analysts.'); S.cash-=12; S.flags.pub=true; S.energy=Math.min(maxEnergy(),S.energy+1); hud(); say(null,'Steak and ale pie. +1 energy. The landlord tells you about 1987 again.'); }},
    {l:'Chat with the locals (1 energy)', s:'Chance of +Charm', f:()=>{ if (!useEnergy(1)) return; gainXp(8); if (rnd()<0.25){ S.stats.charm++; say(null,'You make the whole bar laugh with a story about the interview. +1 Charm.'); } else say(null, pick(['The farmer thinks the stock market is "a casino with better suits". He is not entirely wrong.','The landlord: "In my day we shouted. Now you click. Same thing, less fun."','Someone\'s cousin works at Barkleys. Apparently the canteen is excellent.'])); }},
    {l:'Leave', f:stepBack}]); }
function library(){ say(null,'Ashbury Library. Three shelves of finance, a kind librarian and a radiator that actually works.', [
    {l:'Study for the AFA exam (2 energy)', cls:'gold', s:'+2 study points, chance of +Analysis', f:()=>{ if (!useEnergy(2)) return; study(2); }},
    {l:'Read old annual reports (1 energy)', s:'+XP', f:()=>{ if (!useEnergy(1)) return; gainXp(12); say(null, pick(['Meridian Bank, 1996. Fewer pictures, more numbers. You learn what "goodwill" hides.','Orbital Freight has had four CFOs in nine years. You write that down.','A pamphlet: "Passive investing: why your fund manager is a coin flip in a suit."'])); }},
    {l:'Leave', f:stepBack}]); }
function study(n){ S.study.pts+=n; gainXp(10*n); let t=`You study. ${n} study point${n>1?'s':''} (${S.study.pts} total).`; if (rnd()<0.12*n){ S.stats.analysis++; t+=' Something clicks. +1 Analysis.'; } const need=S.study.cert===0?4:10; t+=S.study.cert>=2?'':`\nNext exam needs ${need} points${S.study.pts>=need?'. You\'re ready. The AFA Institute is in the city.':'.'}`; say(null,t); }
function institute(){ const lvl=S.study.cert+1; if (lvl>2) return say(null,'AFA Institute. You hold both levels. The receptionist asks if you\'d like to teach.', [{l:'Leave', f:stepBack}]);
  const need=lvl===1?4:10, fee=lvl===1?300:600; const p=clamp(0.35+0.1*S.stats.analysis+0.04*(S.study.pts-need),0.05,0.95);
  say(null,`AFA Institute. Associate Financial Analyst, level ${lvl}. Fee ${money(fee)}. You have ${S.study.pts} study points (${need} needed).\n\n${S.study.pts>=need?`Estimated chance: ${Math.round(p*100)}%.`:'You are not ready to sit it.'}`, [
    ...(S.study.pts>=need?[{l:`Sit the exam (${money(fee)}, 2 energy)`, cls:'gold', f:()=>{ if (S.cash<fee) return say(null,'You can\'t afford the fee.'); if (!useEnergy(2)) return; S.cash-=fee; if (rnd()<p){ S.study.cert=lvl; S.rep+=5; gainXp(60); say(null,`PASS. You are AFA level ${lvl}. ${lvl===1?'The banks will talk to you now.':'Silverman Sachs and the sovereign fund will talk to you now.'}`); } else say(null,'FAIL. The paper was heavy on fixed income. Your study points stay; come back after more study.'); }}]:[]),
    {l:'Leave', f:stepBack}]); }

/* the laptop at home: job portal, study, personal brokerage, housing, tickets, your own fund */
function laptop(){ const canFund=netWorth()>=300000&&S.rep>=100;
  say(null,`Your laptop. ${S.job?`Payslips from ${firm().name}.`:'An inbox full of rejections.'} Net worth ${money(netWorth())}.`, [
    {l:'Job portal', s:'All firms, requirements, what you qualify for', f:jobPortal},
    {l:'Study for the AFA exam (2 energy)', s:'+1 study point (the library gives 2)', f:()=>{ if (!useEnergy(2)) return; study(1); }},
    {l:'Hawkeye Brokers: personal account', s:'Trade your own money', f:brokerage},
    ...(S.job?[{l:`Resign from ${firm().name}`, cls:'red', s:'You keep your reputation and CV, lose the book. No cooldown.', f:()=>say(null,`Resign from ${firm().name}? You can apply anywhere afterwards.`, [{l:'Resign', cls:'red', f:()=>{ const n=firm().name; resign(); say(null,`You send a two-line email to ${n}. Nobody replies. You are unemployed.`); }}, {l:'Stay', f:laptop}])}]:[]),
    {l:'Housing', s:HOMES[S.home.tier].t, f:housing},
    {l:S.home.pass>=S.day?`Season ticket valid ${S.home.pass-S.day} more day(s)`:`Buy season ticket ($${PASS_COST}, ${PASS_DAYS} days)`, dis:S.home.pass>=S.day, f:()=>{ if (S.cash<PASS_COST) return say(null,'Not enough money.'); S.cash-=PASS_COST; S.home.pass=S.day+PASS_DAYS; say(null,'Season ticket bought. The train is free for a month.'); }},
    ...(canFund?[{l:'Found your own fund', cls:'gold', s:'You have the money and the name. This ends the game.', f:()=>{ S.over='won'; save(); say(null,'You register "'+pick(['Ashbury','Mill Lane','Hollow Oak'])+' Capital" and sign a lease on the fourth floor. Two investors from the café call before lunch.\n\nYou started in a bedsit above a chip shop.\n\nYOU WON.', [{l:'Start again', f:restart}]); }}]:[]),
    {l:'Close', f:closeDlg}]); }
function jobPortal(){ const m=$('mini'); m.classList.add('open');
  m.innerHTML=`<div class="top"><b>JOB PORTAL</b><button class="close" id="miniClose">CLOSE</button></div><div style="font-size:13px;color:var(--ink-2)">Apply in person. One employer at a time: resign (laptop or at a reception) before you interview elsewhere. Big firms pay less to start but go much further. Hedge funds pay more and fire faster.</div>`+
    FIRMS.map(f=>{ const rq=reqs(f); const ok=qualifies(f); const here=S.job&&S.job.firm===f.id; return `<div class="row"><div><b>${f.name}</b>${here?' · <span class="ok">YOU WORK HERE</span>':''}<small>${money(f.salary)}/day · book ${moneyM(f.book)}→${moneyM(f.maxBook)} · bonus ${Math.round(f.bonus*100)}% · fired at −${Math.round(f.fireLoss*100)}%</small><small>${rq.length?rq.map(r=>`<span class="${r.ok?'ok':'no'}">${r.t}</span>`).join(' · '):'no requirements'}</small></div><span class="${here?'ok':S.job?'no':ok?'ok':'no'}">${here?'CURRENT':S.job?'RESIGN FIRST':ok?'QUALIFY':'NOT YET'}</span></div>`; }).join('');
  $('miniClose').onclick=()=>m.classList.remove('open'); closeDlg(); }
function brokerage(){ const lines=TICK.filter(k=>S.ppos[k.t]).map(k=>`${k.t} ${S.ppos[k.t]} sh · ${money(S.ppos[k.t]*S.px[k.t])}`).join('\n')||'no holdings';
  say(null,`Hawkeye Brokers. Cash ${money(S.cash)}.\nHoldings:\n${lines}`, [{l:'Buy', f:()=>say(null,'Buy what?', TICK.map(k=>({l:`${k.t} · ${S.px[k.t].toFixed(2)}`, s:k.n, f:()=>say(null,`How much ${k.t}?`, [0.25,0.5,1].map(p=>({l:`${Math.round(p*100)}% of cash (${money(S.cash*p)})`, f:()=>{ const sh=Math.floor(S.cash*p/S.px[k.t]); if (sh<1) return say(null,'Not enough cash for one share.'); S.cash-=sh*S.px[k.t]; S.ppos[k.t]+=sh; S.flags.ptraded=true; gainXp(5); say(null,`Bought ${sh} ${k.t}.`); }})).concat([{l:'Back', f:brokerage}]))})).concat([{l:'Back', f:brokerage}]))},
    {l:'Sell', f:()=>{ const has=TICK.filter(k=>S.ppos[k.t]); if (!has.length) return say(null,'Nothing to sell.'); say(null,'Sell what?', has.map(k=>({l:`Sell all ${k.t} (${money(S.ppos[k.t]*S.px[k.t])})`, f:()=>{ S.cash+=S.ppos[k.t]*S.px[k.t]; S.ppos[k.t]=0; say(null,`Sold. Cash ${money(S.cash)}.`); }})).concat([{l:'Back', f:brokerage}])); }}, {l:'Close', f:closeDlg}]); }
function housing(){ const t=S.home.tier; const opts=HOMES.map((h,i)=>({l:`${h.t}${i===t?' (current)':''}`, s:`Rent ${money(h.rent)}/week · deposit ${money(h.deposit)} · ${h.energy} energy/day`, dis:i===t, cls:i>t?'gold':'', f:()=>{ if (i>t&&S.cash<h.deposit) return say(null,`You need ${money(h.deposit)} for the deposit.`); if (i>t) S.cash-=h.deposit; S.home.tier=i; S.energy=Math.min(S.energy,maxEnergy()); say(null,`You move to ${h.t}. ${h.desc}`); }}));
  say(null,'Ashbury housing. Rent is due every Monday. Fall two weeks behind and you are out.', opts.concat([{l:'Close', f:closeDlg}])); }

/* ---------- desk: research & trading with the firm's book ---------- */
const rules=()=>(firm()&&firm().rules)||{};
function canTrade(k, dir){ const r=rules(); if (dir<0&&r.noShort) return `${firm().name} does not short. House rule.`; if ((r.exclude||[]).includes(k)) return `${tk(k).n} is on the exclusion list. ${first(firm().staff.extra.name)} would have your head.`; return null; }
function deskMenu(){ const m=msHere(); const open=TICK.filter(k=>S.pos[k.t]).map(k=>`${k.t}: ${S.pos[k.t]>0?'long':'short'} ${money(Math.abs(S.pos[k.t])*S.px[k.t])}`).join('\n')||'none';
  say(null, `Your desk. Three screens, a cold cup of coffee. Book ${moneyM(book())}.\nOpen positions:\n${open}`, [
    {l:'Research a stock (2 energy)', s:'Read the signal with your Analysis', f:()=>{ if (!useEnergy(2)) return; closeDlg(); openResearch(); }},
    ...(m&&m.stage===1&&!m.bet ? [{l:`Take a view on ${m.tk}`, cls:'gold', s:`${m.clues.length} of 5 clues · reports in ${m.earnDay-S.day} day(s)`, f:()=>{ const stake=Math.min(0.4, Math.max(0.1, SC.firm.fireLoss*2), rules().maxSize||1); const cap=book()*stake*(m.big?2:1); const place=dir=>{ const err=canTrade(m.tk,dir); if (err) return say(null,err); const sh=Math.floor(cap/S.px[m.tk])*dir; S.pos[m.tk]+=sh; m.bet=dir>0?'long':'short'; S.flags.traded=true; gainXp(10); say(null, `${dir>0?'LONG':'SHORT'} ${m.tk} for ${money(Math.abs(sh)*S.px[m.tk])}${m.big?' with firm capital':''}. Now we wait.`); };
        say(null, `The ${m.tk} case. Clues: ${m.clues.map(c=>({mentor:first(SC.firm.staff.mentor.name),extra:first(SC.firm.staff.extra.name),terminal:'terminal',cafe:'café'})[c]).join(', ')||'none yet'}.\n${m.big?`${first(SC.firm.staff.boss.name)} has doubled your stake: ${Math.round(stake*200)}% of the book.`:`Stake: ${Math.round(stake*100)}% of the book.`}`, [{l:'LONG: they beat', f:()=>place(1)}, {l:'SHORT: they miss', f:()=>place(-1)}, {l:'Stay out', s:'The boss will ask why', f:()=>{ m.bet='none'; say(null,'You close the tab. Sometimes the best trade is no trade. Your boss may not agree.'); }}, {l:'Wait', f:closeDlg}]); }}] : []),
    {l:'Close a position', f:()=>{ const has=TICK.filter(k=>S.pos[k.t]); if (!has.length) return say(null,'You have no open positions.'); say(null,'Which one?', has.map(k=>({l:`Close ${k.t}`, f:()=>{ S.pos[k.t]=0; gainXp(3); say(null,`${k.t} closed.`); }})).concat([{l:'None', f:closeDlg}])); }},
    {l:'Stand up', f:closeDlg}]);
}
let miniSel=null;
function openResearch(){
  const m=$('mini'); m.classList.add('open'); miniSel=TICK[0].t; const r=rules(); const sizes=[0.15,0.35,0.6].filter(s=>!r.maxSize||s<=r.maxSize+1e-9);
  m.innerHTML=`<div class="top"><b>RESEARCH · ${SC.firm.short}</b><button class="close" id="miniClose">CLOSE</button></div>
    <div class="tk" id="tk"></div><canvas id="mchart" width="700" height="320"></canvas><div class="read" id="read"></div>
    <div class="tk" id="sizes">${sizes.map((s,i)=>`<button data-s="${s}" aria-pressed="${i===0}">${Math.round(s*100)}% of book</button>`).join('')}</div>
    <div class="choices" style="grid-template-columns:1fr 1fr"><button id="mLong" class="green">LONG</button><button id="mShort" class="red" ${r.noShort?'disabled':''}>SHORT${r.noShort?' (house rule: no)':''}</button></div>`;
  $('miniClose').onclick=()=>{ m.classList.remove('open'); };
  let size=sizes[0]; m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ size=+b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  const tkEl=$('tk'); TICK.forEach(k=>{ const b=document.createElement('button'); b.textContent=k.t; b.setAttribute('aria-pressed', k.t===miniSel); b.onclick=()=>{ miniSel=k.t; tkEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawRead(); }; tkEl.appendChild(b); });
  S.flags.researched=true; gainXp(10);
  function drawRead(){ const k=tk(miniSel); const h=S.hist[k.t]; const cv=$('mchart'), c=cv.getContext('2d'); c.clearRect(0,0,700,320); const mn=Math.min(...h), mx=Math.max(...h), rg=mx-mn||1;
    c.strokeStyle='#3a4256'; c.lineWidth=1; for (let i=0;i<5;i++){ const y=20+i*70; c.beginPath(); c.moveTo(0,y); c.lineTo(700,y); c.stroke(); }
    c.strokeStyle=h[h.length-1]>=h[0]?'#5ee28a':'#ff6b6b'; c.lineWidth=3; c.beginPath(); h.forEach((v,i)=>{ const x=i/(h.length-1)*690+5, y=300-(v-mn)/rg*270; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
    c.fillStyle='#a8adbd'; c.font='16px IBM Plex Sans'; c.fillText(`${k.t} · ${k.n} · ${S.px[k.t].toFixed(2)}`, 10, 316);
    if (!S.signals[k.t] || S.signals[k.t].day!==S.day){ const clarity=clamp(0.25+S.stats.analysis*0.12+(S.flags.quantModel?0.2:0),0,0.95); const noise=(rnd()-0.5)*0.03*(1-clarity); S.signals[k.t]={day:S.day, v:S.drift[k.t]+noise, clarity}; }
    const sg=S.signals[k.t]; const strength=Math.abs(sg.v)>0.008?'strong':Math.abs(sg.v)>0.003?'weak':'no';
    const ex=(r.exclude||[]).includes(k.t)?'<br><small style="color:var(--red)">On the exclusion list here.</small>':'';
    $('read').innerHTML=`Your read on <b>${k.t}</b>: ${strength} <b>${sg.v>0.003?'positive':sg.v<-0.003?'negative':''}</b> signal · clarity ${Math.round(sg.clarity*100)}%<br><small style="color:var(--ink-2)">${sg.clarity<0.5?'You are not sure. More Analysis gives cleaner reads.':sg.clarity<0.75?'Fairly sure, but there is noise.':'Pretty sure.'}</small>${ex}`; }
  drawRead();
  const place=dir=>{ const k=miniSel; const err=canTrade(k,dir); if (err){ toast(err); return; } const sh=Math.floor(book()*size/S.px[k])*dir; S.pos[k]+=sh; S.flags.traded=true; gainXp(8); m.classList.remove('open'); toast(`${dir>0?'LONG':'SHORT'} ${k} · ${money(Math.abs(sh)*S.px[k])}`); save(); };
  $('mLong').onclick=()=>place(1); $('mShort').onclick=()=>place(-1);
}

/* ---------- day cycle ---------- */
const bossNpc=f=>{ const h=hash(f.staff.boss.name); return {name:f.staff.boss.name, role:f.staff.boss.title, frames:charFrames(HAIRS[h%HAIRS.length], f.color, '#1c1a22', SKINS[(h>>5)%SKINS.length])}; };
function restart(){ S=fresh(); save(); closeDlg(); $('sheet').classList.remove('open'); $('mini').classList.remove('open'); go('home',null,4,5,'down'); intro(); }
function gameOver(text){ save(); say(null, text+'\n\nGAME OVER.', [{l:'Start again', f:restart}]); }
function endDay(){
  closeDlg(); $('mini').classList.remove('open');
  const f=firm(), j=S.job; const old={}; let pnl=0; const lines=[];
  for (const k of TICK){ old[k.t]=S.px[k.t]; if (rnd()<0.1) S.drift[k.t]=(rnd()-0.5)*0.02; S.px[k.t]*=1+S.drift[k.t]+k.vol*gauss(); S.hist[k.t].push(S.px[k.t]); if (S.hist[k.t].length>40) S.hist[k.t].shift(); }
  let earn='';
  if (S.ms&&S.ms.stage===1&&S.day+1>=S.ms.earnDay){ const m=S.ms, t=m.tk; const jump=(m.truth==='beat'?0.18:-0.19)+0.03*gauss(); S.px[t]*=1+jump; S.hist[t].push(S.px[t]); m.stage=2; S.drift[t]=m.truth==='beat'?0.006:-0.006;
    earn=`\n\n${t} REPORTS: ${m.truth==='beat'?'BEATS estimates. Stock +'+Math.round(jump*100)+'%':'MISSES. Stock −'+Math.round(-jump*100)+'%'}.${j&&m.firm===j.firm?` ${first(f.staff.boss.name)} wants to see you.`:''}`; }
